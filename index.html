function updateHatchIncubationCalc(){
  const layEl = document.getElementById('hatchLayDateField');
  const hatchEl = document.getElementById('hatchHatchDateField');
  const daysEl = document.getElementById('hatchIncubationDaysField');
  const ageEl = document.getElementById('hatchAgeNote');
  if(ageEl && hatchEl){
    ageEl.textContent = hatchEl.value ? `현재 나이: ${ageLabel(hatchEl.value)}` : '';
  }
  if(!layEl || !hatchEl || !daysEl) return;
  if(layEl.value && hatchEl.value){
    const d = daysBetween(layEl.value, hatchEl.value);
    daysEl.value = d>=0 ? d : '';
  } else {
    daysEl.value = '';
  }
}

async function saveHatchling(id){
  const form = document.getElementById('hatchling-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  obj.price = parseNumberInput(obj.price);
  obj.morph = readMorphValue('hatch');
  obj.morphHet = readHetValue('hatch');
  obj.morphPatterns = readChipGroup('hatchPatterns');
  obj.morphColors = readChipGroup('hatchColors');
  obj.photos = formPhotoState.photos;
  obj.primaryPhotoId = formPhotoState.primaryId;
  obj.salePlatform = readSalePlatformValue('hatch');
  if(id){
    const item = state.hatchlings.find(h=>h.id===id);
    Object.assign(item, obj);
  } else {
    const yy = currentYY();
    obj.id = nextEntityId('HCC-H'+yy+'-', state.hatchlings, 4);
    obj.promotedToId = null;
    state.hatchlings.push(obj);
  }
  syncClutchHatchCount(obj.clutchId, true);
  closeModal();
  await persistAndRender();
}

/* 이 클러치에 실제 연결된 해칭개체 수만큼 실제 해칭 수를 자동으로 맞춰준다.
   bumpOnly=true면 기존 수동 입력값보다 늘어날 때만 반영(과거 수기 입력 보존),
   false면(삭제 시) 정확히 다시 계산해서 반영한다. */
function syncClutchHatchCount(clutchId, bumpOnly){
  if(!clutchId) return;
  const c = state.clutches.find(x=>x.id===clutchId);
  if(!c) return;
  const linkedCount = state.hatchlings.filter(h=>h.clutchId===clutchId).length;
  if(bumpOnly){
    const current = parseInt(c.actualHatchCount,10) || 0;
    if(linkedCount>current) c.actualHatchCount = linkedCount;
  } else {
    c.actualHatchCount = linkedCount;
  }
}

async function deleteHatchling(id){
  if(!confirm('이 해칭개체 기록을 삭제할까요?')) return;
  const item = state.hatchlings.find(h=>h.id===id);
  const clutchId = item ? item.clutchId : null;
  state.hatchlings = state.hatchlings.filter(h=>h.id!==id);
  syncClutchHatchCount(clutchId, false);
  closeModal();
  await persistAndRender();
}

/* =====================================================================
   실시간 동기화 (Firebase Firestore, 선택 사항)
   - 설정 안 하면 지금처럼 이 기기(localStorage)에만 저장됨 (기본값)
   - 설정하면 같은 설정을 넣은 기기끼리 실시간으로 같은 데이터를 공유함
===================================================================== */

const FIREBASE_CONFIG_KEY = 'hotchoco_firebase_config_v1';
const RECORDS_COLLECTION = 'hotchoco_records';
const OLD_SYNC_DOC_PATH = ['hotchoco_shared', 'state']; // 예전(문서 하나짜리) 동기화 방식 - 마이그레이션 확인용으로만 참조
const KIND_TO_LIST = { individual:'individuals', mating:'matings', clutch:'clutches', hatchling:'hatchlings' };

let syncStatus = 'local'; // 'local' | 'connecting' | 'synced' | 'error'
let firestoreDb = null;
let lastSyncedSnapshot = {}; // id -> 마지막으로 클라우드와 맞춰본 JSON 문자열 (변경분만 골라 올리기 위한 기준)

function getFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveFirebaseConfig(cfg){
  try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearFirebaseConfig(){
  try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('스크립트 로드 실패: '+src));
    document.head.appendChild(s);
  });
}

async function loadFirebaseSDK(){
  if(window.firebase && window.firebase.firestore) return true;
  try{
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    return true;
  }catch(e){
    console.error('Firebase SDK 로드 실패', e);
    return false;
  }
}

/* 동기화 구조: 개체 하나하나를 각자 별도 문서로 저장(컬렉션 hotchoco_records, 문서ID=그 개체의 고유번호).
   Firestore 문서 1개당 1MB 제한이 있는데, 예전처럼 전체를 문서 하나에 몰아넣으면 사진이 쌓이면서
   금방 한계에 부딪힘 - 개체별로 쪼개면 한 마리 사진 몇 장 갖고는 절대 한계에 안 부딪힘. */
function initSync(){
  return new Promise(async (resolve)=>{
    const cfg = getFirebaseConfig();
    if(!cfg){ syncStatus='local'; resolve(); return; }
    syncStatus = 'connecting';
    const ok = await loadFirebaseSDK();
    if(!ok){ syncStatus='error'; resolve(); return; }
    try{
      if(!firebase.apps || firebase.apps.length===0){
        firebase.initializeApp(cfg);
      }
      await firebase.auth().signInAnonymously();
      firestoreDb = firebase.firestore();
      const colRef = firestoreDb.collection(RECORDS_COLLECTION);

      let resolved = false;
      const timeout = setTimeout(()=>{
        if(!resolved){ resolved = true; syncStatus = syncStatus==='connecting'?'error':syncStatus; resolve(); }
      }, 6000);

      const snap = await colRef.get();
      if(snap.empty){
        /* 새 방식(문서 여러 개) 컬렉션이 비어있다 - 아직 이 컬렉션으로 넘어온 적이 없다는 뜻.
           이 상태에서 지금 이 기기의 로컬 데이터를 그냥 밀어넣으면, 이 기기가 방금 켜졌거나
           오래돼서 로컬 데이터가 낡은 경우 그 낡은 내용으로 다른 기기 데이터를 덮어써버리는
           심각한 사고가 날 수 있다 - 그래서 먼저 예전 방식(문서 하나짜리) 클라우드 데이터가
           남아있는지 확인해서, 있으면 그걸 우선 기준으로 삼는다. */
        let migratedFromOldDoc = false;
        try{
          const oldDocRef = firestoreDb.collection(OLD_SYNC_DOC_PATH[0]).doc(OLD_SYNC_DOC_PATH[1]);
          const oldSnap = await oldDocRef.get();
          if(oldSnap.exists){
            const oldData = oldSnap.data();
            if(oldData && oldData.json){
              const oldState = JSON.parse(oldData.json);
              if(oldState && (oldState.individuals||[]).length + (oldState.matings||[]).length + (oldState.clutches||[]).length + (oldState.hatchlings||[]).length > 0){
                state = oldState;
                migratedFromOldDoc = true;
              }
            }
          }
        }catch(e){ console.error('예전 동기화 데이터 확인 실패', e); }
        await pushAllEntitiesToCloud();
        if(migratedFromOldDoc){ render(); }
      } else {
        const newState = { individuals:[], matings:[], clutches:[], hatchlings:[] };
        lastSyncedSnapshot = {};
        snap.forEach(doc=>{
          const d = doc.data();
          const listKey = KIND_TO_LIST[d.kind];
          if(!listKey || !d.data) return;
          newState[listKey].push(d.data);
          lastSyncedSnapshot[doc.id] = JSON.stringify(d.data);
        });
        state = newState;
      }
      syncStatus = 'synced';
      if(!resolved){ resolved = true; clearTimeout(timeout); resolve(); }

      colRef.onSnapshot(liveSnap=>{
        let changedAny = false;
        liveSnap.docChanges().forEach(change=>{
          const d = change.doc.data();
          const listKey = KIND_TO_LIST[d.kind];
          if(!listKey) return;
          if(change.type==='removed'){
            state[listKey] = (state[listKey]||[]).filter(x=>x.id!==change.doc.id);
            delete lastSyncedSnapshot[change.doc.id];
            changedAny = true;
          } else {
            if(!d.data) return;
            const idx = (state[listKey]||[]).findIndex(x=>x.id===change.doc.id);
            if(idx>=0) state[listKey][idx] = d.data;
            else { if(!state[listKey]) state[listKey]=[]; state[listKey].push(d.data); }
            lastSyncedSnapshot[change.doc.id] = JSON.stringify(d.data);
            changedAny = true;
          }
        });
        if(changedAny) render();
      }, err=>{
        console.error('동기화 오류', err);
        syncStatus = 'error';
      });
    }catch(e){
      console.error('Firebase 초기화 실패', e);
      syncStatus = 'error';
      resolve();
    }
  });
}

async function pushAllEntitiesToCloud(){
  if(!firestoreDb) return;
  const colRef = firestoreDb.collection(RECORDS_COLLECTION);
  const batch = firestoreDb.batch();
  let count = 0;
  Object.keys(KIND_TO_LIST).forEach(kind=>{
    const listKey = KIND_TO_LIST[kind];
    (state[listKey]||[]).forEach(item=>{
      batch.set(colRef.doc(item.id), { kind, data: item, updatedAt: Date.now() });
      lastSyncedSnapshot[item.id] = JSON.stringify(item);
      count++;
    });
  });
  if(count>0){
    try{ await batch.commit(); }catch(e){ console.error('초기 업로드 실패', e); }
  }
}

/* 저장할 때마다 전체를 다시 밀어넣지 않고, 마지막으로 클라우드와 맞춰본 이후 실제로
   바뀐(추가/수정/삭제된) 개체만 골라서 올린다. */
async function pushChangedEntitiesToCloud(){
  if(!firestoreDb) return;
  const colRef = firestoreDb.collection(RECORDS_COLLECTION);
  const currentMap = {};
  Object.keys(KIND_TO_LIST).forEach(kind=>{
    const listKey = KIND_TO_LIST[kind];
    (state[listKey]||[]).forEach(item=>{
      if(item && item.id) currentMap[item.id] = { kind, item, json: JSON.stringify(item) };
    });
  });
  const batch = firestoreDb.batch();
  let hasChanges = false;
  Object.keys(currentMap).forEach(id=>{
    const { kind, item, json } = currentMap[id];
    if(lastSyncedSnapshot[id] !== json){
      batch.set(colRef.doc(id), { kind, data: item, updatedAt: Date.now() });
      hasChanges = true;
    }
  });
  Object.keys(lastSyncedSnapshot).forEach(id=>{
    if(!(id in currentMap)){
      batch.delete(colRef.doc(id));
      hasChanges = true;
    }
  });
  if(!hasChanges) return;
  try{
    await batch.commit();
    Object.keys(currentMap).forEach(id=>{ lastSyncedSnapshot[id] = currentMap[id].json; });
    Object.keys(lastSyncedSnapshot).forEach(id=>{ if(!(id in currentMap)) delete lastSyncedSnapshot[id]; });
  }catch(e){
    console.error('클라우드 업로드 실패', e);
  }
}

/* ---------------- 설정 탭 UI ---------------- */
function syncStatusText(){
  return {
    local: '이 기기에만 저장 중 (동기화 꺼짐)',
    connecting: '연결 중…',

    error: '연결 오류 — 설정값을 다시 확인해주세요'

/* ---------------- 긴급 복구: 예전(문서 하나짜리) 동기화 데이터 확인/복원 ---------------- */
async function checkOldSyncDoc(){
  if(!firestoreDb){
    alert('동기화가 연결되어 있지 않아요. 먼저 동기화를 켜주세요.');
    return;
  }
  try{
    const oldDocRef = firestoreDb.collection(OLD_SYNC_DOC_PATH[0]).doc(OLD_SYNC_DOC_PATH[1]);
    const oldSnap = await oldDocRef.get();
    if(!oldSnap.exists){
      alert('예전 방식 데이터를 찾을 수 없어요.');
      return;
    }
    const oldData = oldSnap.data();
    if(!oldData || !oldData.json){
      alert('예전 방식 문서는 있는데 안에 데이터가 없어요.');
      return;
    }
    const oldState = JSON.parse(oldData.json);
    const counts = {
      individuals: (oldState.individuals||[]).length,
      matings: (oldState.matings||[]).length,
      clutches: (oldState.clutches||[]).length,
      hatchlings: (oldState.hatchlings||[]).length
    };
    const currentCounts = {
      individuals: state.individuals.length,
      matings: state.matings.length,
      clutches: state.clutches.length,
      hatchlings: state.hatchlings.length
    };
    const updatedAtStr = oldData.updatedAt ? new Date(oldData.updatedAt).toLocaleString('ko-KR') : '알 수 없음';
    const msg = `예전 클라우드 데이터 (마지막 저장: ${updatedAtStr})\n\n`+
      `개체 ${counts.individuals}마리 · 메이팅 ${counts.matings}건 · 알 ${counts.clutches}건 · 해칭개체 ${counts.hatchlings}마리\n\n`+
      `(지금 이 화면에 보이는 값: 개체 ${currentCounts.individuals} · 메이팅 ${currentCounts.matings} · 알 ${currentCounts.clutches} · 해칭개체 ${currentCounts.hatchlings})\n\n`+
      `이 예전 데이터로 지금 상태를 덮어쓸까요? (지금 화면 내용은 사라지고 이걸로 교체돼요)`;
    if(confirm(msg)){
      state = oldState;
      lastSyncedSnapshot = {};
      await pushAllEntitiesToCloud();
      await storageSet(STORAGE_KEY, JSON.stringify(state));
      render();
      alert('복원했어요. 개체·메이팅·알·해칭개체 목록에서 확인해보세요.');
    }
  }catch(e){
    console.error(e);
    alert('확인 중 오류가 발생했어요: '+e.message);
  }
}

function exportBackup(){
  try{
    const payload = JSON.stringify(state, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hotchoco_backup_${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }catch(e){
    alert('내보내기 실패: '+e.message);
  }
}

function triggerImportBackup(){
  const el = document.getElementById('backup-import-input');
  if(el) el.click();
}

async function handleImportBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const validShape = parsed && Array.isArray(parsed.individuals) && Array.isArray(parsed.matings) && Array.isArray(parsed.clutches) && Array.isArray(parsed.hatchlings);
    if(!validShape){
      alert('올바른 백업 파일이 아니에요. HotChocoCre에서 내보낸 파일이 맞는지 확인해주세요.');
      inputEl.value = '';
      return;
    }
    const ok = confirm(`이 백업 파일로 복원하면 지금 있는 데이터(개체 ${state.individuals.length}마리 · 메이팅 ${state.matings.length}건 · 알 ${state.clutches.length}건 · 해칭개체 ${state.hatchlings.length}마리)는 전부 사라지고 백업 시점(개체 ${parsed.individuals.length}마리 등)으로 덮어써져요.\n계속할까요?`);
    if(!ok){ inputEl.value=''; return; }
    state = parsed;
    inputEl.value = '';
    await persistAndRender();
    alert('복원이 완료됐어요!');
  }catch(e){
    alert('가져오기 실패: 파일이 손상되었거나 형식이 올바르지 않아요.');
    inputEl.value = '';
  }
}

  const cfg = {};
  fd.forEach((v,k)=>cfg[k]=v.trim());

  closeModal();
  location.reload();

/* =====================================================================
   분양완료 탭 (개체 + 해칭개체 중 상태='분양 완료'인 것 모아보기)
===================================================================== */

let soldSort = 'saledate_desc';
const SOLD_SORTERS = {
  saledate_desc: (a,b)=>(b.saleDate||'').localeCompare(a.saleDate||''),
  saledate_asc:  (a,b)=>(a.saleDate||'').localeCompare(b.saleDate||''),
  price_desc: (a,b)=>(parseFloat(b.salePrice)||0)-(parseFloat(a.salePrice)||0),
  price_asc:  (a,b)=>(parseFloat(a.salePrice)||0)-(parseFloat(b.salePrice)||0)
};
function setSoldSort(v){ soldSort = v; renderMainOnly(); }
let soldYearFilter = '';
function setSoldYearFilter(v){ soldYearFilter = v; renderMainOnly(); }

let soldViewMode = 'card';
function setSoldViewMode(v){
  soldViewMode = v;
  renderMainOnly();
  const cardBtn = document.getElementById('sold-view-card-btn');
  const compactBtn = document.getElementById('sold-view-compact-btn');
  if(cardBtn) cardBtn.classList.toggle('chip-selected', v==='card');
  if(compactBtn) compactBtn.classList.toggle('chip-selected', v==='compact');
}

function getAllSoldRecordsUnfiltered(){
  const list = [];
  state.individuals.forEach(i=>{
    if(i.status==='분양 완료'){
      list.push({
        kind:'individual', id:i.id, label:i.name||'(이름없음)',
        morph:i.morph, morphHet:i.morphHet,
        parents:`${i.sireName||'-'} × ${i.damName||'-'}`,
        hatchDate:i.hatchDate, gender:i.gender,
        salePlatform:i.salePlatform, saleDate:i.saleDate, salePrice:i.salePrice,
        photos:i.photos||[], primaryPhotoId:i.primaryPhotoId||null
      });
    }
  });
  state.hatchlings.forEach(h=>{
    if(h.status==='분양 완료'){
      list.push({
        kind:'hatchling', id:h.id, label:h.morph||'모프 미정',
        morph:h.morph, morphHet:h.morphHet,
        parents:`${h.sireName||'-'} × ${h.damName||'-'}`,
        hatchDate:h.hatchDate, gender:h.gender,
        salePlatform:h.salePlatform, saleDate:h.saleDate, salePrice:h.price,
        photos:h.photos||[], primaryPhotoId:h.primaryPhotoId||null
      });
    }
  });
  return list;
}
/* 실제 기록에 있는 연도 + 최소 2026년부터 올해(그리고 미래 날짜로 미리 적어둔 연도가 있으면 그것까지)를 모두 포함 */
function getSoldYearOptions(allRecords){
  const years = new Set();
  years.add(2026);
  years.add(new Date().getFullYear());
  allRecords.forEach(r=>{
    if(r.saleDate){
      const y = parseInt(r.saleDate.slice(0,4), 10);
      if(!isNaN(y)) years.add(y);
    }
  });
  return Array.from(years).sort((a,b)=>a-b);
}
function getSoldRecords(){
  let list = getAllSoldRecordsUnfiltered();
  if(soldYearFilter){
    list = list.filter(r=>r.saleDate && r.saleDate.slice(0,4)===soldYearFilter);
  }
  list.sort(SOLD_SORTERS[soldSort] || SOLD_SORTERS.saledate_desc);
  return list;
}

function renderSoldCompactRow(r){
  const openFn = r.kind==='individual' ? `openIndividualDetail('${r.id}')` : `openHatchlingDetail('${r.id}')`;
  const age = r.hatchDate ? ageLabel(r.hatchDate) : '';
  let line2;
  if(r.kind==='individual'){
    const morphLabel = formatMorphFull(r.morph, r.morphHet).main;
    line2 = `${morphLabel?esc(morphLabel)+' · ':''}${esc(r.gender)||'-'}`;
  } else {
    line2 = `${r.morphHet?esc(formatHetDisplay(r.morphHet))+' · ':''}${esc(r.gender)||'-'}`;
  }
  return `<div class="compact-row" onclick="${openFn}">
    ${avatarHtml(r, r.kind, 30)}
    <div class="compact-info">
      <div class="compact-name">${esc(r.label)}${age?` (${age})`:''}</div>
      <div class="compact-meta">${line2}</div>
      <div class="compact-meta">${r.salePrice?fmtMoney(r.salePrice):'가격 미입력'}${r.saleDate?(' · '+esc(r.saleDate)):''}</div>
    </div>
  </div>`;
}

function renderSoldTab(){
  const allRecords = getAllSoldRecordsUnfiltered();
  const records = getSoldRecords();
  const totalAmount = records.reduce((sum,r)=>sum+(parseFloat(r.salePrice)||0),0);
  const yearOptions = getSoldYearOptions(allRecords);

  const sortOptions = [
    {v:'saledate_desc',l:'분양일 최신순'},
    {v:'saledate_asc',l:'분양일 오래된순'},
    {v:'price_desc',l:'가격 높은순'},
    {v:'price_asc',l:'가격 낮은순'}
  ];

  let html = `<div class="section-head"><h2>분양완료</h2></div>
  <div class="searchbar">
    <select onchange="setSoldYearFilter(this.value)" style="flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:13px;background:var(--surface);color:var(--ink-soft);">
      <option value="" ${soldYearFilter===''?'selected':''}>전체보기</option>
      ${yearOptions.map(y=>`<option value="${y}" ${String(y)===soldYearFilter?'selected':''}>${y}년</option>`).join('')}
    </select>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="${statNumClass(fmtMoney(totalAmount))}">${fmtMoney(totalAmount)}</div><div class="lbl">${soldYearFilter?soldYearFilter+'년 ':'총 '}누적 분양 금액</div></div>
    <div class="stat-card"><div class="num">${records.length}</div><div class="lbl">${soldYearFilter?soldYearFilter+'년 ':'총 '}분양 개체수</div></div>
  </div>`;

  if(allRecords.length===0){
    html += `<div class="empty-state"><div class="dotrow"><span></span><span></span><span></span><span></span><span></span></div><p>아직 분양 완료된 개체가 없어요.<br>개체·해칭개체 상태를 '분양 완료'로 바꾸면 여기 모여요.</p></div>`;
    return html;
  }
  if(records.length===0){
    html += `<div class="empty-state"><p>${esc(soldYearFilter)}년에 분양 완료된 개체가 없어요.</p></div>`;
    return html;
  }

  html += `<div class="searchbar">
    <button type="button" id="sold-view-card-btn" class="chip-toggle ${soldViewMode==='card'?'chip-selected':''}" style="flex:1;" onclick="setSoldViewMode('card')">카드형</button>
    <button type="button" id="sold-view-compact-btn" class="chip-toggle ${soldViewMode==='compact'?'chip-selected':''}" style="flex:1;" onclick="setSoldViewMode('compact')">간단히 보기</button>
  </div>`;

  html += `<div class="searchbar">
    <select onchange="setSoldSort(this.value)" style="flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:13px;background:var(--surface);color:var(--ink-soft);">
      ${sortOptions.map(o=>`<option value="${o.v}" ${o.v===soldSort?'selected':''}>${o.l}</option>`).join('')}
    </select>
  </div>`;

  if(soldViewMode==='compact'){
    html += `<div class="compact-list">${records.map(renderSoldCompactRow).join('')}</div>`;
    return html;
  }

  records.forEach(r=>{
    const openFn = r.kind==='individual' ? `openIndividualDetail('${r.id}')` : `openHatchlingDetail('${r.id}')`;
    html += `<div class="card" onclick="${openFn}">
      <div class="card-top">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          ${avatarHtml(r, r.kind)}
          <div><div class="card-title">${esc(r.label)}</div><div class="card-id">${esc(r.id)}</div></div>
        </div>
        <div class="chip alt">${r.salePrice?fmtMoney(r.salePrice):'가격 미입력'}</div>
      </div>
      <div class="card-meta">
        <span class="chip muted">${esc(r.gender)}</span>
        ${r.salePlatform?`<span class="chip muted">${esc(r.salePlatform)}</span>`:''}
        ${r.kind==='individual'?`<span class="chip">개체</span>`:`<span class="chip muted">해칭개체</span>`}
      </div>
      <div class="card-sub">부모 ${esc(r.parents)} · 해칭일 ${esc(r.hatchDate)||'-'}${r.hatchDate?` (${ageLabel(r.hatchDate)})`:''} · 분양일 ${esc(r.saleDate)||'미입력'}</div>
    </div>`;
  });

  return html;
}

const APP_BUILD_VERSION = '2026-08-28 15:09 KST';
async function checkForNewVersion(){
  try{
    const res = await fetch(location.href, { cache: 'no-store' });
    if(!res.ok) return;
    const text = await res.text();
    const m = text.match(/<!--\s*BUILD_VERSION:\s*([^-]+?)\s*-->/);
    if(m && m[1] && m[1].trim() && m[1].trim() !== APP_BUILD_VERSION){
      showUpdateAvailableBanner();
    }
  }catch(e){ /* 오프라인이거나 네트워크 문제면 그냥 조용히 무시 */ }
}
function showUpdateAvailableBanner(){
  if(document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.innerHTML = `🔄 새 버전이 있어요 — 눌러서 새로고침`;
  banner.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pine-deep);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.3);cursor:pointer;white-space:nowrap;';
  banner.onclick = ()=>{ location.reload(); };
  document.body.appendChild(banner);
}
