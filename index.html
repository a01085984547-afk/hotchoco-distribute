<style>
:root{
  --bg:#F7F1E3; --surface:#FFFFFF; --surface-2:#FBF6EA; --border:#E7DBC4;
  --ink:#2B2118; --ink-soft:#6E5D4C; --ink-faint:#A6947F;
  --pine:#4A2E1B; --pine-deep:#2B1810; --moss:#3E7C55; --moss-soft:#E4EFE4;
  --amber:#B97A3D; --amber-soft:#F3E3C8; --danger:#B8412F; --danger-soft:#F7E2DC;
  --warning:#C98A32; --warning-soft:#F6E9D2; --safe:#2F7D4F; --safe-soft:#E1F0E4;
  --caution:#8A7A3E; --caution-soft:#F1ECD6;
  --radius:16px; --radius-sm:10px;
  --font-display:'Fraunces',serif; --font-body:'Inter',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --shadow:0 2px 10px rgba(43,24,16,0.07),0 1px 2px rgba(43,24,16,0.07);
}
*{box-sizing:border-box;min-width:0;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;width:100%;}

.dotrow{display:flex;gap:5px;align-items:center;}
.dotrow span{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;}
.dotrow span:nth-child(1){opacity:.35}.dotrow span:nth-child(2){opacity:.6}.dotrow span:nth-child(3){opacity:.9}
.dotrow span:nth-child(4){opacity:.6}.dotrow span:nth-child(5){opacity:.35}

header.topbar{background:linear-gradient(160deg,var(--pine) 0%,var(--pine-deep) 100%);color:#F3EFDF;padding:16px 18px 14px;position:sticky;top:0;z-index:20;}
.settings-gear-btn{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.14);border:none;color:#F3EFDF;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.settings-gear-btn:active{background:rgba(255,255,255,0.24);}
header.topbar .brand-plaque{background:#FFFFFF;border-radius:12px;padding:10px 16px;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
header.topbar .brand-logo{height:72px;display:block;}
.tabstrip{display:flex;gap:4px;overflow-x:auto;margin-top:16px;-ms-overflow-style:none;scrollbar-width:none;padding-bottom:2px;}
.tabstrip::-webkit-scrollbar{display:none;}
.tabbtn{flex:0 0 auto;background:rgba(43,24,16,0.06);color:var(--ink-soft);border:1px solid rgba(43,24,16,0.10);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;font-family:var(--font-body);cursor:pointer;white-space:nowrap;}
.tabbtn.active{background:var(--pine-deep);color:#F3EFDF;border-color:var(--pine-deep);}

main{padding:16px 16px 100px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
.section-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;color:var(--pine-deep);}
.section-head .count{font-size:12px;color:var(--ink-faint);font-weight:600;}
.section-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:-6px 0 14px;}

.searchbar{display:flex;gap:8px;margin-bottom:14px;}
.searchbar input{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-family:var(--font-body);color:var(--ink);}
.searchbar input:focus{outline:2px solid var(--moss);outline-offset:-1px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.card:active{background:var(--surface-2);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;color:var(--ink);}
.card-id{font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:1px;}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--moss-soft);color:var(--moss);}
.chip.alt{background:var(--amber-soft);color:var(--amber);}
.chip.muted{background:#EEEBDF;color:var(--ink-soft);}
.chip.danger{background:var(--danger-soft);color:var(--danger);}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
.compact-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.compact-row{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:0;}
.compact-row:active{background:var(--surface-2);}
.compact-info{min-width:0;flex:1;}
.compact-name{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.compact-sub{font-size:10.5px;color:var(--ink-faint);font-weight:500;font-family:var(--font-body);display:block;}
.compact-meta{font-size:10.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exit-toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
  background:rgba(18,29,20,0.92);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:600;font-family:var(--font-body);z-index:999;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);pointer-events:none;
  opacity:1;transition:opacity .3s;white-space:nowrap;
}
.exit-toast-out{opacity:0;}
.card-datarow{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.card-datarow .dcell{text-align:left;}
.card-datarow .dcell .lbl{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.card-datarow .dcell .val{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--pine-deep);margin-top:2px;}
.card-datarow-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.card-datarow-half .dcell{text-align:left;min-width:0;}
.card-datarow-half .dcell .lbl{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.card-datarow-half .dcell .val{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--pine-deep);margin-top:2px;}

<div id="app"></div>
<div id="modal-root"></div>
<script type="application/json" id="seed-data">{"개체관리": [], "페어링관리": [], "산란알관리": [], "해칭개체": []}</script>
<script>
/* =====================================================================
   핫초코 크레스티드 매니저 v2
   개체 · 메이팅 · 산란/알(카운터) · 해칭개체 · 혈통검사
===================================================================== */

const STORAGE_KEY = 'hotchoco_data_v2';

let state = null;
let currentTab = 'dashboard';
let listFilters = { individual:'', mating:'', hatchling:'' };
let pedigreeSel = { a:'', b:'' };
let expandedMatings = new Set();

/* ---------------- helpers ---------------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  if(n===null||n===undefined||n==='') return '';
  return Number(n).toLocaleString('ko-KR')+'원';
}
/* 통계 카드 숫자가 길어지면(특히 누적 금액) 박스를 넘어가지 않도록 글자 크기를 자동으로 줄인다 */
function statNumClass(text){
  const len = String(text).length;
  if(len<=9) return 'num';
  if(len<=13) return 'num num-md';
  return 'num num-sm';
}
function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
/* 해칭일 기준 나이를 "N개월" / "N년 M개월" / 어리면 "N일"로 사람이 읽기 좋게 */
function ageLabel(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date();
  if(isNaN(d.getTime())) return '';
  let months = (now.getFullYear()-d.getFullYear())*12 + (now.getMonth()-d.getMonth());
  if(now.getDate() < d.getDate()) months--;
  if(months < 0) months = 0;
  if(months < 1){
    const days = Math.max(0, daysBetween(dateStr, todayISO()));
    return `${days}일`;
  }
  if(months >= 12){
    const years = Math.floor(months/12);
    const rem = months % 12;
    return rem>0 ? `${years}년 ${rem}개월` : `${years}년`;
  }
  return `${months}개월`;
}
function addDays(dateStr, days){
  if(!dateStr || days===null || days===undefined || isNaN(days)) return null;
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+Math.round(days));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}
function fmtKo(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function nextEntityId(prefix, list, pad){
  let max = 0;
  list.forEach(item=>{
    if(item.id && item.id.startsWith(prefix)){
      const n = parseInt(item.id.slice(prefix.length),10);
      if(!isNaN(n) && n>max) max = n;
    }
  });
  return prefix+String(max+1).padStart(pad,'0');
}
function currentYY(){ return String(new Date().getFullYear()).slice(2); }

/* ---------------- 브리딩/프루븐 여부 자동 연동 (한번 올라간 등급은 자동으로 안 내려감, 수동 변경은 항상 가능) ---------------- */
const BREEDING_LEVEL_NAMES = ['아니오','보류','예'];
function breedingLevelOf(status){
  const idx = BREEDING_LEVEL_NAMES.indexOf(status);
  return idx===-1 ? 0 : idx;
}
function bumpBreedingLevel(individual, suggestedLevel){
  if(!individual) return false;
  const current = breedingLevelOf(individual.breeding);
  if(suggestedLevel > current){
    individual.breeding = BREEDING_LEVEL_NAMES[suggestedLevel];
    return true;
  }
  return false;
}
/* 프루븐(증명됨)은 브리딩 예로 올라가는 것과 별개로, 실제 유정란이 나왔을 때만 세운다.
   (수컷도 정자가 없는 경우가 있어서, 메이팅만으로는 증명됐다고 볼 수 없음) */
function markProven(individual){
  if(!individual) return false;
  let changed = false;
  if(individual.provenStatus!=='예'){ individual.provenStatus='예'; changed=true; }
  if(bumpBreedingLevel(individual, 2)) changed = true;
  return changed;
}

/* ---------------- 부화기간 온도표 + 보간 ---------------- */
const INCUBATION_TABLE = [
  {temp:20.0, min:104, max:130, avg:117, source:'chart'},
  {temp:21.1, min:83,  max:120, avg:102, source:'chart'},
  {temp:22.2, min:70,  max:100, avg:85,  source:'chart'},
  {temp:23.3, min:56,  max:84,  avg:70,  source:'chart'},
  {temp:24.0, min:69,  max:73,  avg:70,  source:'user'},
  {temp:24.4, min:46,  max:74,  avg:60,  source:'chart'},
  {temp:25.0, min:null,max:null,avg:60,  source:'user'},
  {temp:25.6, min:42,  max:65,  avg:54,  source:'chart'},
  {temp:26.7, min:null,max:60,  avg:50,  source:'chart'},
];
const MIN_SAFE_TEMP = 20.0;
const MAX_SAFE_TEMP = 26.7;
const DEFAULT_INCUBATION_TEMP = 24;
const DEFAULT_CYCLE_DAYS = 30;

function interpolateField(temp, field){
  const pts = INCUBATION_TABLE.filter(t=>t[field]!==null).sort((a,b)=>a.temp-b.temp);
  if(pts.length===0) return null;
  const exact = pts.find(p=>Math.abs(p.temp-temp)<0.001);
  if(exact) return exact[field];
  if(temp <= pts[0].temp) return pts[0][field];
  if(temp >= pts[pts.length-1].temp) return pts[pts.length-1][field];
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    if(temp>=a.temp && temp<=b.temp){
      const frac = (temp-a.temp)/(b.temp-a.temp);
      return a[field] + frac*(b[field]-a[field]);
    }
  }
  return null;
}
function predictHatchDays(temp){
  const t = parseFloat(temp);
  if(isNaN(t)) return {danger:false, min:null, max:null, avg:null};
  const danger = t<MIN_SAFE_TEMP || t>MAX_SAFE_TEMP;
  /* 그 온도에서 실제로 부화시킨 기록이 3건 이상 쌓여있으면, 참고표(고정값) 대신
     우리집 실측 평균을 우선 써서 갈수록 더 정확해지게 한다. */
  const rounded = roundToHalf(t);
  const real = (getTempHatchBreakdown()||[]).find(b=>b.temp===rounded);
  if(real && real.count>=3){
    return { danger, min:real.min, max:real.max, avg:Math.round(real.avg), source:'actual' };
  }
  return {
    danger,
    min: interpolateField(t,'min'), max: interpolateField(t,'max'), avg: interpolateField(t,'avg'),
    source: 'chart'
  };
}
function predictHatchDates(layDate, temp){
  const p = predictHatchDays(temp);
  return {
    ...p,
    minDate: p.min!==null ? addDays(layDate, p.min) : null,
    maxDate: p.max!==null ? addDays(layDate, p.max) : null,
    avgDate: p.avg!==null ? addDays(layDate, p.avg) : null
  };
}

/* ---------------- 시드 변환 (엑셀 → 메이팅 명칭) ---------------- */
function transformSeed(raw){

    keep:r['킵 여부']||'', breeding:r['브리딩 여부']||'', main:r['메인 여부']||'',
    status:r['현재 상태']||'보유', memo:r['메모']||''
  }));
  const matings = (raw['페어링관리']||[]).filter(r=>r['페어링 ID']).map(r=>({

    sireId:r['수컷 ID']||'', sireName:r['수컷 이름']||'',
    matingLog: r['시작일'] ? [r['시작일']] : [],
    status:r['상태']||'진행 중', seasonEndDate:'',
    cycleDays: DEFAULT_CYCLE_DAYS, incubationTemp: DEFAULT_INCUBATION_TEMP
  }));
  const clutches = (raw['산란알관리']||[]).filter(r=>r['클러치 ID']).map(r=>({
    id:r['클러치 ID'], matingId:(r['페어링 ID']||''),
    damId:r['암컷 ID']||'', damName:r['암컷 이름']||'',
    sireId:r['부 ID']||'', sireName:r['부 이름']||'',
    clutchNum:r['산란 차수']||'', layDate:r['산란일']||'',
    egg1Status:r['알1 상태']||'', egg2Status:r['알2 상태']||'',
    incubationTemp: DEFAULT_INCUBATION_TEMP,
    actualHatchCount:r['실제 해칭 수'], failCount:r['부화 실패 수'], note:r['특이사항']||''
  }));
  const hatchlings = (raw['해칭개체']||[]).filter(r=>r['해칭 개체 ID']).map(r=>({
    id:r['해칭 개체 ID'], clutchId:r['클러치 ID']||'', eggLabel:r['알 번호']||'',
    layDate:r['산란일']||'', hatchDate:r['해칭일']||'', incubationDays:r['인큐베이션 일수'],
    damId:r['모 ID']||'', damName:r['모 이름']||'', sireId:r['부 ID']||'', sireName:r['부 이름']||'',
    morph:r['확정 모프']||'', gender:r['성별']||'미구분', dotStatus:r['점 여부']||'',
    keep:r['킵 여부']||'', breeding:r['브리딩 여부']||'', main:r['메인 여부']||'',
    status:r['현재 상태']||'보유', price:r['분양가'], note:'', promotedToId:null
  }));
  return { individuals, matings, clutches, hatchlings };
}

/* ---------------- 레거시 모프 코드(Ax, LwHAx 등) → 새 모프/헷 체계 자동 변환 ---------------- */
const LEGACY_MORPH_MAP = {
  'Ax':      {morph:'아잔틱', het:''},
  'LwHAx':   {morph:'릴리화이트', het:'헷아잔틱'},
  'LwAx':    {morph:'릴잔틱', het:''},
  'NHAx':    {morph:'노멀', het:'헷아잔틱'},
  'Normal':  {morph:'노멀', het:''}
};
function migrateLegacyMorphs(st){
  let changed = false;
  function applyPair(target, morphField, hetField){
    const mapped = LEGACY_MORPH_MAP[target[morphField]];
    if(mapped){
      target[morphField] = mapped.morph;
      target[hetField] = mapped.het;
      changed = true;
    }
  }
  (st.individuals||[]).forEach(i=>{
    applyPair(i,'morph','morphHet');
    applyPair(i,'sireMorph','sireHet');
    applyPair(i,'damMorph','damHet');
  });
  (st.hatchlings||[]).forEach(h=>{
    applyPair(h,'morph','morphHet');
  });
  return changed;
}

/* ---------------- 개체 ID: 성별 기반 (수컷 M / 암컷 F / 미구분 U) ---------------- */
function genderIdPrefix(gender){
  if(gender==='수컷') return 'HCC-M-';
  if(gender==='암컷') return 'HCC-F-';
  return 'HCC-U-';
}

/* 예전 HCC-E-xxxx 개체 ID를 성별 기반 ID로 일괄 전환하고, 다른 곳에서의 참조(부모ID, 메이팅/클러치/해칭개체의 dam/sireId, 승급연결)까지 전부 갱신한다. */
/* idMap = {기존ID: 새ID} 형태를 받아서, 이 개체를 참조하는 모든 곳(부모연결/메이팅/클러치/해칭개체)을 함께 갱신한다. */
function applyIndividualIdMap(st, idMap){
  (st.individuals||[]).forEach(ind=>{
    if(idMap[ind.id]) ind.id = idMap[ind.id];
    if(ind.sireId && idMap[ind.sireId]) ind.sireId = idMap[ind.sireId];
    if(ind.damId && idMap[ind.damId]) ind.damId = idMap[ind.damId];
  });
  (st.matings||[]).forEach(m=>{
    if(m.damId && idMap[m.damId]) m.damId = idMap[m.damId];
    if(m.sireId && idMap[m.sireId]) m.sireId = idMap[m.sireId];
  });
  (st.clutches||[]).forEach(c=>{
    if(c.damId && idMap[c.damId]) c.damId = idMap[c.damId];
    if(c.sireId && idMap[c.sireId]) c.sireId = idMap[c.sireId];
  });
  (st.hatchlings||[]).forEach(h=>{
    if(h.damId && idMap[h.damId]) h.damId = idMap[h.damId];
    if(h.sireId && idMap[h.sireId]) h.sireId = idMap[h.sireId];
    if(h.promotedToId && idMap[h.promotedToId]) h.promotedToId = idMap[h.promotedToId];
  });
}

function migrateIndividualIdsToGenderPrefix(st){
  const needsMigration = (st.individuals||[]).some(i=>i.id && i.id.startsWith('HCC-E-'));
  if(!needsMigration) return false;
  const idMap = {};
  const counters = {};
  st.individuals.slice().sort((a,b)=>(a.id||'').localeCompare(b.id||'')).forEach(ind=>{
    if(!ind.id || !ind.id.startsWith('HCC-E-')) return;
    const prefix = genderIdPrefix(ind.gender);
    counters[prefix] = (counters[prefix]||0)+1;
    idMap[ind.id] = prefix + String(counters[prefix]).padStart(4,'0');
  });
  if(Object.keys(idMap).length===0) return false;
  applyIndividualIdMap(st, idMap);
  return true;
}

/* 개체 ID의 성별 접두사(HCC-M-/HCC-F-/HCC-U-)를 반환 */
function idGenderPrefixOf(id){
  const m = id && id.match(/^HCC-[A-Z]+-/);
  return m ? m[0] : null;
}

/* 성별을 나중에 고쳤을 때, ID만 안전하게 재발급(모든 참조 자동 갱신). 삭제/재등록할 필요 없음. */
async function reissueIndividualId(oldId){
  const ind = state.individuals.find(i=>i.id===oldId);
  if(!ind) return;
  const correctPrefix = genderIdPrefix(ind.gender);
  if(idGenderPrefixOf(oldId)===correctPrefix){
    alert('이미 현재 성별에 맞는 ID예요.');
    return;
  }
  const newId = nextEntityId(correctPrefix, state.individuals, 4);
  if(!confirm(`ID를 ${oldId} → ${newId}(으)로 바꿀까요?\n이 개체를 참조하는 부모 연결·메이팅·클러치·해칭개체 기록이 전부 자동으로 함께 갱신돼요.`)) return;
  applyIndividualIdMap(state, { [oldId]: newId });
  closeModal();
  await persistAndRender();
  openIndividualForm(newId);
}

function formatNumberWithCommas(value){

  return Number(digits).toLocaleString('ko-KR');
}
function parseNumberInput(value){

}

function migrateSaleStatusLabel(st){

function migrateMainToMainSub(st){

}
/* 브리딩/프루븐 자동연동 규칙이 생기기 전부터 있던 과거 메이팅·유정란 기록도
   소급 적용한다(매번 실행해도 안전 - bumpBreedingLevel은 등급을 올리기만 함). */
function migrateBackfillBreedingProven(st){
  let changed = false;
  (st.matings||[]).forEach(m=>{
    const sire = (st.individuals||[]).find(i=>i.id===m.sireId);
    const dam = (st.individuals||[]).find(i=>i.id===m.damId);
    if((m.matingLog||[]).length>0){
      if(bumpBreedingLevel(sire, 1)) changed = true;
      if(bumpBreedingLevel(dam, 1)) changed = true;
    }
    if((m.cohabitLog||[]).length>0){
      if(bumpBreedingLevel(dam, 1)) changed = true;
    }
  });
  (st.clutches||[]).forEach(c=>{
    if(c.egg1Status==='유정' || c.egg2Status==='유정'){
      if(markProven((st.individuals||[]).find(i=>i.id===c.damId))) changed = true;
      if(markProven((st.individuals||[]).find(i=>i.id===c.sireId))) changed = true;
    }
  });
  return changed;
}
/* 진행 중인 메이팅이 하나도 없는 개체는 브리딩 여부를 아니오로 정리한다(프루븐은 안 건드림).
   '산란 종료' 상태 변경이 이 마이그레이션이 생기기 전에 있었던 경우도 정확히 맞춰준다. */
function migrateResetBreedingForEndedMatings(st){
  let changed = false;
  (st.individuals||[]).forEach(i=>{
    const stillActive = (st.matings||[]).some(m=>(m.sireId===i.id||m.damId===i.id) && normalizeMatingStatus(m.status)==='진행 중');
    if(!stillActive && i.breeding && i.breeding!=='아니오'){
      i.breeding = '아니오';
      changed = true;
    }
  });
  return changed;
}
/* ---------------- storage ---------------- */
/* 저장소: Claude 아티팩트 환경(window.storage)에서 열었을 때는 그걸 쓰고,
   폰에 설치해서 독립 실행할 때는 브라우저 localStorage로 자동 전환된다. */
async function storageGet(key){
  if(typeof window.storage!=='undefined' && window.storage){
    try{
      const res = await window.storage.get(key, false);
      if(res && res.value) return res.value;
      return null;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    return localStorage.getItem(key);
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(typeof window.storage!=='undefined' && window.storage){
    try{ await window.storage.set(key, value, false); return; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(key, value); }
  catch(e){ console.error('저장 실패', e); }
}

async function loadState(){
  const raw = await storageGet(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = null; } }
  let fromSeed = false;
  if(!state){
    const seedRaw = JSON.parse(document.getElementById('seed-data').textContent);
    state = transformSeed(seedRaw);
    fromSeed = true;
  }
  const migratedMorphs = migrateLegacyMorphs(state);
  const migratedIds = migrateIndividualIdsToGenderPrefix(state);
  const migratedSaleLabel = migrateSaleStatusLabel(state);
  const migratedMain = migrateMainToMainSub(state);
  const migratedBreeding = migrateBackfillBreedingProven(state);
  const migratedBreedingReset = migrateResetBreedingForEndedMatings(state);
  if(fromSeed || migratedMorphs || migratedIds || migratedSaleLabel || migratedMain || migratedBreeding || migratedBreedingReset){ await saveState(); }
}
async function saveState(){
  await storageSet(STORAGE_KEY, JSON.stringify(state));
  if(firestoreDb){ await pushChangedEntitiesToCloud(); }
}
async function persistAndRender(){ await saveState(); render(); }

/* ---------------- 메이팅 파생 계산 ---------------- */
function clutchesOfMating(matingId){
  return state.clutches.filter(c=>c.matingId===matingId).sort((a,b)=>(a.layDate||'').localeCompare(b.layDate||''));
}
function latestCohabitReferenceDate(mating){
  const log = mating.cohabitLog || [];
  let latest = null;
  log.forEach(c=>{
    if(c.startDate && (!latest || c.startDate>latest)) latest = c.startDate;
  });
  return latest;
}
function activeCohabitation(mating){
  return (mating.cohabitLog||[]).find(c=>c.startDate && !c.endDate) || null;
}
/* 최근 활동이 실제 '메이팅' 기록에서 온 건지 '합사' 기록에서 온 건지 구분해서 라벨을 다르게 붙일 수 있게 */
function latestMatingActivity(mating){
  const candidates = [];
  (mating.matingLog||[]).forEach(d=>{ if(d) candidates.push({date:d, source:'mating'}); });
  const cohabDate = latestCohabitReferenceDate(mating);
  if(cohabDate) candidates.push({date:cohabDate, source:'cohabit'});
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>a.date.localeCompare(b.date));
  return candidates[candidates.length-1];
}
function latestMatingDate(mating){
  const dates = [];
  if(mating.matingLog && mating.matingLog.length) dates.push(...mating.matingLog);
  const cohabDate = latestCohabitReferenceDate(mating);
  if(cohabDate) dates.push(cohabDate);
  if(dates.length===0) return null;
  return dates.slice().sort().slice(-1)[0];
}
function nextClutchNum(mating){
  const cs = clutchesOfMating(mating.id);
  return cs.length+1;
}
function nextLayPrediction(mating){
  if(normalizeMatingStatus(mating.status)==='산란 종료') return null;
  const cs = clutchesOfMating(mating.id);
  if(cs.length===0) return null;
  const last = cs[cs.length-1];
  if(!last.layDate) return null;
  const cycle = mating.cycleDays || DEFAULT_CYCLE_DAYS;
  return addDays(last.layDate, cycle);
}

/* 메이팅 카드용 D-day 정보: 클러치가 있으면 예정일 대비 D-day, 없으면 최근 메이팅일 대비 경과일(D+) */
function matingDdayInfo(mating){
  if(normalizeMatingStatus(mating.status)==='산란 종료') return {mode:'ended'};
  const cs = clutchesOfMating(mating.id);
  if(cs.length===0){
    const last = latestMatingDate(mating);
    if(!last) return {mode:'none'};
    const elapsed = daysBetween(last, todayISO());
    return {mode:'waiting', elapsed};
  }
  const nextDate = nextLayPrediction(mating);
  if(!nextDate) return {mode:'none'};
  const diff = daysBetween(todayISO(), nextDate); // 양수면 D-diff, 음수면 D+
  return {mode:'predicted', date:nextDate, diff};
}
function formatDday(diff){
  if(diff>0) return `D-${diff}`;
  if(diff<0) return `D+${Math.abs(diff)}`;
  return 'D-day';
}

/* ---------------- 메이팅 상태: 진행 중 / 산란 종료 두 가지로 단순화 ---------------- */
function normalizeMatingStatus(status){
  if(status==='산란 종료' || status==='완료' || status==='중단') return '산란 종료';
  return '진행 중'; // '진행 중', '수컷 교체 예정' 등은 모두 진행 중으로 취급
}
function hasAnyActiveMating(individualId){
  return state.matings.some(m => (m.sireId===individualId || m.damId===individualId) && normalizeMatingStatus(m.status)==='진행 중');
}
/* 산란(메이팅)이 끝나면 - 다른 진행 중인 메이팅이 더 없는 한 - 브리딩 여부는 다시 아니오로 리셋한다.
   프루븐 여부는 한번 예가 되면 영구히 유지(여기서 손대지 않음). */
function resetBreedingIfNoActiveMating(individual){
  if(!individual) return false;
  if(hasAnyActiveMating(individual.id)) return false;
  if(individual.breeding==='아니오') return false;
  individual.breeding = '아니오';
  return true;
}
async function toggleMatingStatus(matingId){
  const m = state.matings.find(x=>x.id===matingId);
  if(!m) return;
  const wasActive = normalizeMatingStatus(m.status)==='진행 중';
  m.status = wasActive ? '산란 종료' : '진행 중';
  if(wasActive){
    resetBreedingIfNoActiveMating(state.individuals.find(i=>i.id===m.sireId));
    resetBreedingIfNoActiveMating(state.individuals.find(i=>i.id===m.damId));
  } else {
    // 다시 '진행 중'으로 되돌리면(되돌리기), 새 시즌이 시작된 셈이니 보류로
    bumpBreedingLevel(state.individuals.find(i=>i.id===m.sireId), 1);
    bumpBreedingLevel(state.individuals.find(i=>i.id===m.damId), 1);
  }
  await persistAndRender();
}

/* 실제 해칭 기록을 0.5도 단위로 묶어서, 온도별 실측 평균 부화일수를 계산 (22도부터) */
function roundToHalf(t){ return Math.round(parseFloat(t)*2)/2; }
function getTempHatchBreakdown(){
  const buckets = {};
  state.hatchlings.forEach(h=>{
    const days = parseFloat(h.incubationDays);
    if(isNaN(days)) return;
    const c = state.clutches.find(x=>x.id===h.clutchId);
    const rawTemp = c ? (c.incubationTemp||DEFAULT_INCUBATION_TEMP) : DEFAULT_INCUBATION_TEMP;
    const temp = roundToHalf(rawTemp);
    if(!buckets[temp]) buckets[temp] = [];
    buckets[temp].push(days);
  });
  return Object.keys(buckets).map(t=>({
    temp: parseFloat(t),
    avg: buckets[t].reduce((a,b)=>a+b,0)/buckets[t].length,
    min: Math.min(...buckets[t]),
    max: Math.max(...buckets[t]),
    count: buckets[t].length
  })).sort((a,b)=>a.temp-b.temp);
}

/* =====================================================================
   혈통(근친) 체크 엔진
   - 개체/해칭개체 모두 sireId·damId(연결) 또는 sireName/damName(이름만)
     정보를 가질 수 있음. ID로 연결된 조상은 계속 거슬러 올라가고,
     이름만 있는 조상은 그 지점에서 멈춘다(더 위 세대는 알 수 없음).
   - 이름만 있는 조상이라도 "이름+출신업체"가 같으면 동일 개체로 간주해
     겹침을 잡아낸다.
===================================================================== */

function getEntityById(compositeId){
  // compositeId: "IND:xxx" or "HAT:xxx" or plain individual id
  if(compositeId.startsWith('IND:')) compositeId = compositeId.slice(4);
  if(compositeId.startsWith('HAT:')){
    const id = compositeId.slice(4);
    return state.hatchlings.find(h=>h.id===id) || null;
  }
  return state.individuals.find(i=>i.id===compositeId) || null;
}

function parentRef(entity, side){
  // side: 'sire' or 'dam'
  const idKey = side+'Id', nameKey = side+'Name', coKey = side+'Company';
  if(entity[idKey]){
    return { type:'linked', id: entity[idKey] };
  }
  if(entity[nameKey]){
    return { type:'named', key: (entity[nameKey]||'').trim()+'|'+((entity[coKey]||'').trim()) };
  }
  return null;
}

function buildAncestryMap(startEntity, maxGen){
  maxGen = maxGen || 6;
  const visited = new Map(); // key -> {gen, label, linkedId, branch}
  const queue = [{ent:startEntity, gen:0, branch:null}];
  const seenEnt = new Set();
  while(queue.length){
    const {ent, gen, branch} = queue.shift();
    if(gen>=maxGen) continue;
    ['sire','dam'].forEach(side=>{
      const ref = parentRef(ent, side);
      if(!ref) return;
      const key = ref.type==='linked' ? ('ID:'+ref.id) : ('NAME:'+ref.key);
      const newGen = gen+1;
      const newBranch = branch===null ? side : branch; // 1대에서 정해진 쪽(부/모)을 그대로 물려받음
      const label = ent[side+'Name'] || (ref.type==='linked' ? ((state.individuals.find(i=>i.id===ref.id)||{}).name||'?') : '이름 미상');
      const existing = visited.get(key);
      if(!existing || existing.gen>newGen){
        visited.set(key, {gen:newGen, label, linkedId: ref.type==='linked'?ref.id:null, branch:newBranch});
      }
      if(ref.type==='linked' && !seenEnt.has('ID:'+ref.id+':'+newGen)){
        const nextInd = state.individuals.find(i=>i.id===ref.id);
        if(nextInd){
          seenEnt.add('ID:'+ref.id+':'+newGen);
          queue.push({ent:nextInd, gen:newGen, branch:newBranch});
        }
      }
    });
  }
  return visited;
}

/* 세대수 + 부/모 쪽을 한국어 호칭으로: 1대=부/모, 2대=조부모/외조부모, 3대=증조부모/외증조부모, 4대 이상은 구체적 호칭 없이 "N대 위 조상" */
function kinshipLabel(gen, branch){
  if(gen===1) return branch==='sire' ? '부' : '모';
  if(gen===2) return branch==='sire' ? '조부모' : '외조부모';
  if(gen===3) return branch==='sire' ? '증조부모' : '외증조부모';
  return `${gen}대 위 조상`;
}

function entityKeyOf(ent){
  return 'ID:'+ent.id;
}

function compareBloodline(entA, entB){
  if(!entA || !entB) return null;
  if(entA===entB || (entA.id && entB.id && entA.id===entB.id && entA.name!==undefined && entB.name!==undefined)){
    // same individual object reference check by id only meaningful for individuals
  }
  if(entA.id===entB.id){
    return { level:'danger', title:'동일 개체', detail:'같은 개체를 선택했습니다.', common:[] };
  }
  const mapA = buildAncestryMap(entA);
  const mapB = buildAncestryMap(entB);
  const keyA = entityKeyOf(entA), keyB = entityKeyOf(entB);

  // direct ancestor relation
  if(mapB.has(keyA)){
    const g = mapB.get(keyA).gen;
    return {
      level:'danger',
      title: g===1 ? '부모-자식 관계' : (g===2 ? '조부모-손주 관계' : `직계 조상 관계 (${g}대)`),
      detail:`${entA.name||entA.id}(이)가 ${entB.name||entB.id}의 ${g}대 위 직계 조상입니다. 페어링을 피해주세요.`,
      common:[]
    };
  }
  if(mapA.has(keyB)){
    const g = mapA.get(keyB).gen;
    return {
      level:'danger',
      title: g===1 ? '부모-자식 관계' : (g===2 ? '조부모-손주 관계' : `직계 조상 관계 (${g}대)`),
      detail:`${entB.name||entB.id}(이)가 ${entA.name||entA.id}의 ${g}대 위 직계 조상입니다. 페어링을 피해주세요.`,
      common:[]
    };
  }

  const common = [];
  mapA.forEach((infoA, key)=>{
    if(mapB.has(key)){
      const infoB = mapB.get(key);
      common.push({ key, label:infoA.label, genA:infoA.gen, genB:infoB.gen, branchA:infoA.branch, branchB:infoB.branch });
    }
  });

  if(common.length===0){
    return {
      level:'safe',
      title:'확인된 계보 내 공통 조상 없음',
      detail:'등록된 혈통 정보 범위 안에서는 겹치는 조상이 발견되지 않았습니다.',
      common:[]
    };
  }

  const sameParents = common.filter(c=>c.genA===1 && c.genB===1);
  // F-등급: 공통 조상 하나당 min(genA,genB)를 그 조상까지의 '세대'로 보고,
  // 여러 공통 조상 중 가장 가까운(작은) 값을 전체 근친도로 사용한다.
  // 규칙: F1·F2(부모/조부모 공통 포함 2대 이내) = 절대 불가, F3 = 주의, F4 이상 = 안전.
  const fLevel = Math.min(...common.map(c=>Math.min(c.genA, c.genB)));
  let level, title, detail;
  if(sameParents.length>=2){
    level='danger'; title='완전 형제자매(친남매) — F1';
    detail='양쪽 부모가 모두 같습니다(F1). 절대 페어링하지 마세요.';
  } else if(sameParents.length===1){
    level='danger'; title='이복/이부 형제자매 — F1';
    detail=`부모 중 한쪽(${sameParents[0].label})이 같습니다(F1). 절대 페어링하지 마세요.`;
  } else if(fLevel<=2){
    level='danger'; title=`근친 위험 — F${fLevel}`;
    detail=`공통 조상까지 ${fLevel}대 이내로 가깝습니다(F1~F2급). 절대 페어링하지 마세요.`;
  } else if(fLevel===3){
    level='warning'; title='근친 주의 — F3';
    detail='공통 조상까지 3대 거리입니다(F3급). 가능하면 다른 조합을 우선 고려하세요.';
  } else {
    level='safe'; title=`먼 혈통 — F${fLevel}`;
    detail=`공통 조상까지 ${fLevel}대 이상 떨어져 있어(F4 이상) 실질적 근친 위험은 낮은 편입니다.`;
  }
  common.sort((a,b)=>Math.min(a.genA,a.genB)-Math.min(b.genA,b.genB));
  return { level, title, detail, common };
}

function levelIcon(level){
  return {danger:'⚠️', warning:'⚠️', caution:'ℹ️', safe:'✅'}[level] || 'ℹ️';
}
function levelLabel(level){
  return {danger:'위험', warning:'주의', caution:'참고', safe:'안전'}[level] || '';
}

function renderBloodlineBanner(entA, entB){
  if(!entA || !entB) return '';
  const r = compareBloodline(entA, entB);
  if(!r) return '';
  let html = `<div class="bloodline-banner ${r.level}">
    <b>${levelIcon(r.level)} [${levelLabel(r.level)}] ${esc(r.title)}</b>
    ${esc(r.detail)}`;
  if(r.common && r.common.length){
    html += `<ul>` + r.common.slice(0,5).map(c=>
      `<li>공통 조상: <b>${esc(c.label)}</b> (${esc(entA.name||entA.morph||'A')}쪽 ${esc(kinshipLabel(c.genA,c.branchA))} / ${esc(entB.name||entB.morph||'B')}쪽 ${esc(kinshipLabel(c.genB,c.branchB))})</li>`
    ).join('') + `</ul>`;
  }
  html += `</div>`;
  return html;
}

/* ---------------- 탭 화면 좌우 스와이프로 넘기기 ---------------- */
function setupSwipeNav(){
  const main = document.getElementById('main-content');
  if(!main) return;
  let touchStartX = null, touchStartY = null;
  main.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, {passive:true});
  main.addEventListener('touchend', function(e){
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return; // 세로 스크롤과 헷갈리지 않게
    const swipableKeys = TABS.map(t=>t.key);
    const idx = swipableKeys.indexOf(currentTab);
    if(idx===-1) return; // 설정 탭 등에선 스와이프 비활성
    if(dx < 0 && idx < swipableKeys.length-1){
      switchTab(swipableKeys[idx+1]); // 왼쪽으로 스와이프 -> 다음 탭
    } else if(dx > 0 && idx > 0){
      switchTab(swipableKeys[idx-1]); // 오른쪽으로 스와이프 -> 이전 탭
    }
  }, {passive:true});
}

function renderTabContent(){
  switch(currentTab){
    case 'dashboard': return renderDashboard();
    case 'individual': return renderIndividualList();
    case 'mating': return renderMatingList();
    case 'egg': return renderEggTab();
    case 'hatchling': return renderHatchlingList();
    case 'sold': return renderSoldTab();
    case 'pedigree': return renderPedigreeTab();
    case 'settings': return renderSettingsTab();
    default: return '';
  }
}

function renderFab(){
  const map = {
    individual:`openIndividualForm(null)`,
    mating:`openMatingForm(null)`,
    hatchling:`openHatchlingForm(null)`
  };
  if(!map[currentTab]) return '';
  return `<button class="fab" onclick="${map[currentTab]}">+</button>`;
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const ind = state.individuals;
  const heldCount = ind.filter(i=>i.status==='보유').length;
  const breedingCount = ind.filter(i=>i.breeding==='예').length;
  const activeMatings = state.matings.filter(m=>normalizeMatingStatus(m.status)==='진행 중');
  /* '부화 대기'는 유정란 중 아직 해칭 기록이 안 된 것만 - 무정란은 애초에 부화할 게 없으니 제외 */
  let openEggCount = 0;
  const openFertileClutches = [];
  state.clutches.forEach(c=>{
    const pendingA = c.egg1Status==='유정' && !hatchlingForEgg(c.id,'A');
    const pendingB = c.egg2Status==='유정' && !hatchlingForEgg(c.id,'B');
    if(pendingA) openEggCount++;
    if(pendingB) openEggCount++;
    if(pendingA || pendingB) openFertileClutches.push(c);
  });

  let html = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${heldCount}</div><div class="lbl">보유 개체</div></div>
      <div class="stat-card"><div class="num">${breedingCount}</div><div class="lbl">브리딩 개체</div></div>
      <div class="stat-card"><div class="num">${activeMatings.length}</div><div class="lbl">진행 중 메이팅</div></div>
      <div class="stat-card"><div class="num">${openEggCount}</div><div class="lbl">부화 대기 알</div></div>
    </div>
  `;

  // 다가오는 일정: 산란예정 1주일 이내 메이팅 + 부화예정 1주일 이내 알 (±7일 범위 - 너무 지난 건 안 보이게)
  const alerts = [];
  activeMatings.forEach(m=>{
    const dday = matingDdayInfo(m);
    if(dday.mode==='predicted' && dday.diff<=7 && dday.diff>=-7){
      alerts.push({
        type:'mating', diff:dday.diff, date:dday.date,
        title:`${m.damName} × ${m.sireName}`,
        sub:`${nextClutchNum(m)}차 산란예정`
      });
    }
  });
  openFertileClutches.forEach(c=>{
    const pred = predictHatchDates(c.layDate, c.incubationTemp||DEFAULT_INCUBATION_TEMP);
    if(pred.avgDate){
      const diff = daysBetween(todayISO(), pred.avgDate);
      if(diff<=7 && diff>=-7){
        alerts.push({
          type:'egg', diff, date:pred.avgDate,
          title:`${c.damName} × ${c.sireName}`,
          sub:`${c.clutchNum}차 알 부화예정`
        });
      }
    }
  });
  alerts.sort((a,b)=>a.diff-b.diff);

  /* 껍데기 상태가 이상(눈꽃알 등)한데 아직 부화 전인 알들 - 날짜 상관없이 항상 눈에 띄게 */
  const watchEggs = [];
  openFertileClutches.forEach(c=>{
    ['A','B'].forEach((label,idx)=>{
      const num = idx+1;
      const sf = num===1?'egg1Status':'egg2Status';
      if(c[sf]==='유정' && !hatchlingForEgg(c.id,label)){
        const warnings = eggWarningLabels(c, num);
        if(warnings.length){
          watchEggs.push({ clutchId:c.id, title:`${c.damName} × ${c.sireName}`, sub:`${c.clutchNum}차 알 ${label} · ${warnings.join(', ')}` });
        }
      }
    });
  });
  if(watchEggs.length>0){
    html += `<div class="section-head"><h2>⚠️ 주의 깊게 볼 알</h2></div>`;
    watchEggs.forEach(w=>{
      html += `<div class="alert-card danger" onclick="switchTab('egg')" style="cursor:pointer;">
        <div class="icon">🥚</div>
        <div class="body"><b>${esc(w.title)}</b><span>${esc(w.sub)}</span></div>
      </div>`;
    });
  }

  html += `<div class="section-head"><h2>다가오는 일정</h2></div>`;
  if(alerts.length===0){
    html += `<div class="empty-state"><div class="dotrow"><span></span><span></span><span></span><span></span><span></span></div><p>1주일 안에 예정된 산란·부화가 없어요.</p></div>`;
  } else {
    alerts.forEach(a=>{
      const overdue = a.diff<0;
      const level = overdue ? 'danger' : (a.diff<=3 ? 'warning' : 'safe');
      const icon = a.type==='mating' ? '💞' : '🥚';
      const targetTab = a.type==='mating' ? 'mating' : 'egg';
      html += `<div class="alert-card ${level}" onclick="switchTab('${targetTab}')" style="cursor:pointer;">
        <div class="icon">${icon}</div>
        <div class="body"><b>${esc(a.title)} — ${esc(a.sub)}</b><span>${fmtKo(a.date)} (${formatDday(a.diff)})</span></div>
      </div>`;
    });
  }

  html += `<div class="disclaimer">부화·산란 예정일은 등록된 정보를 기준으로 계산한 참고용 결과입니다.</div>`;
  return html;
}

function avatarHtml(entity, kind, size){
  const photos = entity.photos || [];
  const sizeAttr = size ? ` style="width:${size}px;height:${size}px;"` : '';
  if(photos.length===0) return `<div class="card-avatar-placeholder"${sizeAttr}>🦎</div>`;
  const primaryIdx = Math.max(0, photos.findIndex(p=>p.id===entity.primaryPhotoId));
  const photo = photos[primaryIdx] || photos[0];
  if(!kind) return `<img src="${photo.dataUrl}" class="card-avatar"${sizeAttr}>`;
  return `<img src="${photo.dataUrl}" class="card-avatar"${sizeAttr} onclick="event.stopPropagation(); openPhotoViewer('${kind}','${entity.id}', ${primaryIdx})">`;
}

function openModal(title, bodyHtml){
  const root = document.getElementById('modal-root');
  const wasOpen = root.innerHTML.trim().length > 0;
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        ${bodyHtml}
      </div>
    </div>`;
  /* 폰 뒤로가기 버튼을 눌렀을 때 앱이 꺼지지 않고 모달만 닫히도록,
     모달이 열릴 때 히스토리를 하나 쌓아둔다(이미 모달이 열려있던 상태에서
     내용만 바뀌는 경우는 새로 쌓지 않음 - 예: 개체수정 안에서 가계도 보기). */
  if(!wasOpen){
    pushBackGuard();
    modalGuardActive = true;
  }
}
function closeModal(){
  history.back(); // popstate 핸들러가 실제로 닫아줌
}
function closeModalUiOnly(){
  document.getElementById('modal-root').innerHTML = '';
}

/* ---------------- 뒤로가기 처리: 모달 중이면 모달만 닫고, 메인 화면이면 "두 번 눌러 종료" ----------------
   modalGuardActive로 "지금 쌓여있는 기록 한 칸이 모달용인지"를 명시적으로 추적한다.
   (모달 안에서 내용만 바뀌는 경우는 이 플래그를 새로 세우지 않으므로, 닫을 때
   기록을 다시 안 쌓아서 매번 정확히 원래 깊이로 돌아온다 - 이전 버전의 "쌓이는" 버그 수정) */
function pushBackGuard(){
  try{ history.pushState({guard:Date.now()}, ''); }catch(e){}
}
let modalGuardActive = false;
let exitArmed = false;
let exitArmTimer = null;
function showExitToast(){
  const old = document.getElementById('exit-toast');
  if(old) old.remove();
  const toast = document.createElement('div');
  toast.id = 'exit-toast';
  toast.className = 'exit-toast';
  toast.textContent = '뒤로 버튼을 한 번 더 누르면 종료돼요';
  document.body.appendChild(toast);
  setTimeout(()=>{
    toast.classList.add('exit-toast-out');
    setTimeout(()=>toast.remove(), 300);
  }, 1600);
}
window.addEventListener('popstate', function(){
  if(modalGuardActive){
    modalGuardActive = false;
    closeModalUiOnly();
    return; // 새로 쌓지 않음 - 원래 깊이로 정확히 복귀
  }
  if(!exitArmed){
    exitArmed = true;
    showExitToast();
    clearTimeout(exitArmTimer);
    exitArmTimer = setTimeout(()=>{ exitArmed = false; }, 2000);
    pushBackGuard();
  } else {
    clearTimeout(exitArmTimer);
    exitArmed = false;
    history.back(); // 남은 마지막 기록도 소모시켜 실제로 앱이 종료되게 함
  }
});

let formPhotoState = { photos: [], primaryId: null };

function initPhotoState(photos, primaryId){
  const list = (photos||[]).map(p=>({id:p.id, dataUrl:p.dataUrl}));
  formPhotoState = { photos: list, primaryId: primaryId || (list[0] ? list[0].id : null) };

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFileSelect(inputEl){
  const files = inputEl.files;
  if(!files || files.length===0) return;
  for(let i=0; i<files.length; i++){
    if(formPhotoState.photos.length>=3) break;
    let dataUrl;
    try{
      dataUrl = await compressImageFile(files[i], 720, 0.8);
    }catch(e){
      console.error('사진 처리 실패', e);
      continue;
    }
    const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    formPhotoState.photos.push({id, dataUrl});
    if(!formPhotoState.primaryId) formPhotoState.primaryId = id;
  }
  inputEl.value = '';
  renderPhotoStrip();
}

  formPhotoState.photos = formPhotoState.photos.filter(p=>p.id!==id);

let photoViewerState = { kind:null, id:null, index:0 };
let photoViewerTouchX = null;
let photoZoom = { scale:1, tx:0, ty:0 };
let photoZoomPanStart = null;
let photoZoomLastTap = 0;
let photoZoomPinchStartDist = null;
let photoZoomPinchStartScale = 1;

function openPhotoViewer(kind, id, startIndex){
  const entity = kind==='individual' ? state.individuals.find(i=>i.id===id) : state.hatchlings.find(h=>h.id===id);
  if(!entity || !(entity.photos||[]).length) return;

function photoViewerEntity(){

    ? state.individuals.find(i=>i.id===photoViewerState.id)

}
function renderPhotoViewer(){
  const entity = photoViewerEntity();
  if(!entity){ closeModal(); return; }
  const photos = entity.photos || [];
  if(photos.length===0){ closeModal(); return; }
  const idx = ((photoViewerState.index % photos.length) + photos.length) % photos.length;
  photoViewerState.index = idx;
  const photo = photos[idx];
  const isPrimary = photo.id === entity.primaryPhotoId;

  const body = `
    <div style="position:relative;overflow:hidden;border-radius:14px;background:var(--surface-2);touch-action:none;"
         ontouchstart="photoViewerImgTouchStart(event)" ontouchmove="photoViewerImgTouchMove(event)" ontouchend="photoViewerImgTouchEnd(event)">
      <img id="photo-viewer-img" src="${photo.dataUrl}" style="width:100%;display:block;transform-origin:center center;">
      ${photos.length>1?`
        <button type="button" onclick="photoViewerNav(-1)" class="photo-viewer-nav" style="left:6px;">‹</button>
        <button type="button" onclick="photoViewerNav(1)" class="photo-viewer-nav" style="right:6px;">›</button>
      `:''}
    </div>
    ${photos.length>1?`<div style="display:flex;justify-content:center;gap:6px;margin-top:12px;">
      ${photos.map((p,i)=>`<span style="width:7px;height:7px;border-radius:50%;background:${i===idx?'var(--pine)':'var(--border)'};display:inline-block;"></span>`).join('')}
    </div>`:''}
    <div style="text-align:center;font-size:12px;color:var(--ink-faint);margin-top:8px;">${idx+1} / ${photos.length}${isPrimary?' · 대표 사진 ★':''} · 두 번 탭하거나 두 손가락으로 확대</div>
  `;
  openModal(label, body);
}
function photoViewerNav(delta){
  photoViewerState.index += delta;
  renderPhotoViewer();
}
function applyPhotoZoom(){
  const img = document.getElementById('photo-viewer-img');
  if(!img) return;
  img.style.transform = `translate(${photoZoom.tx}px, ${photoZoom.ty}px) scale(${photoZoom.scale})`;
}
function touchDist(t0, t1){
  return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
}
function photoViewerImgTouchStart(e){
  if(e.touches.length===2){
    photoZoomPinchStartDist = touchDist(e.touches[0], e.touches[1]);
    photoZoomPinchStartScale = photoZoom.scale;
    photoViewerTouchX = null;
    return;
  }
  if(e.touches.length===1){
    const now = Date.now();
    if(now - photoZoomLastTap < 300){
      // 더블탭: 확대<->원상태 토글
      if(photoZoom.scale > 1){
        photoZoom = { scale:1, tx:0, ty:0 };
      } else {
        photoZoom = { scale:2.2, tx:0, ty:0 };
      }
      applyPhotoZoom();
      photoZoomLastTap = 0;
      photoZoomPanStart = null;
      return;
    }
    photoZoomLastTap = now;
    if(photoZoom.scale > 1){
      photoZoomPanStart = { x: e.touches[0].clientX - photoZoom.tx, y: e.touches[0].clientY - photoZoom.ty };
    } else {
      photoViewerTouchX = e.touches[0].clientX;
    }
  }
}
function photoViewerImgTouchMove(e){
  if(e.touches.length===2 && photoZoomPinchStartDist){
    const dist = touchDist(e.touches[0], e.touches[1]);
    const next = photoZoomPinchStartScale * (dist / photoZoomPinchStartDist);
    photoZoom.scale = Math.min(4, Math.max(1, next));
    applyPhotoZoom();
    return;
  }
  if(photoZoomPanStart && e.touches.length===1 && photoZoom.scale>1){
    photoZoom.tx = e.touches[0].clientX - photoZoomPanStart.x;
    photoZoom.ty = e.touches[0].clientY - photoZoomPanStart.y;
    applyPhotoZoom();
  }
}
function photoViewerImgTouchEnd(e){
  photoZoomPinchStartDist = null;
  photoZoomPanStart = null;
  if(photoZoom.scale <= 1.02 && photoViewerTouchX !== null && e.changedTouches.length){
    const dx = e.changedTouches[0].clientX - photoViewerTouchX;
    photoViewerTouchX = null;
    if(Math.abs(dx) > 40) photoViewerNav(dx < 0 ? 1 : -1);
  }
  if(photoZoom.scale < 1.05 && photoZoom.scale !== 1){
    photoZoom = { scale:1, tx:0, ty:0 };
    applyPhotoZoom();
  }
}

function latestMatingDateForIndividual(individualId){
  let latest = null;
  state.matings.forEach(m=>{
    if(m.damId!==individualId && m.sireId!==individualId) return;
    const d = latestMatingDate(m);
    if(d && (!latest || d>latest)) latest = d;
  });
  return latest;
}
function latestInfertileLayDateForDam(individualId){
  let latest = null;
  state.clutches.forEach(c=>{
    if(c.damId!==individualId) return;
    const hasInfertile = c.egg1Status==='무정' || c.egg2Status==='무정';
    if(hasInfertile && c.layDate && (!latest || c.layDate>latest)) latest = c.layDate;
  });
  return latest;
}
/* 메이팅을 거친 무정란 기록(클러치)과, 메이팅 없이 혼자 낳은 걸 수기로 적어둔 날짜 중 더 최근 것을 보여준다 */
function combinedLastInfertileLayDate(ind){
  const fromClutch = latestInfertileLayDateForDam(ind.id);
  const manual = ind.lastSoloInfertileLayDate || null;
  if(fromClutch && manual) return fromClutch > manual ? fromClutch : manual;
  return fromClutch || manual || null;
}

async function saveIndividual(id){
  const form = document.getElementById('individual-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  obj.salePrice = parseNumberInput(obj.salePrice);
  obj.morph = readMorphValue('own');
  obj.morphHet = readHetValue('own');
  obj.morphPatterns = readChipGroup('ownPatterns');
  obj.morphColors = readChipGroup('ownColors');
  obj.photos = formPhotoState.photos;
  obj.primaryPhotoId = formPhotoState.primaryId;
  obj.salePlatform = readSalePlatformValue('own');
  obj.sireMorph = readMorphValue('sire');
  obj.sireHet = readHetValue('sire');
  obj.sirePatterns = readChipGroup('sirePatterns');
  obj.sireColors = readChipGroup('sireColors');
  obj.damMorph = readMorphValue('dam');
  obj.damHet = readHetValue('dam');
  obj.damPatterns = readChipGroup('damPatterns');
  obj.damColors = readChipGroup('damColors');
  if(id){
    const item = state.individuals.find(i=>i.id===id);
    Object.assign(item, obj);
  } else {
    obj.id = nextEntityId(genderIdPrefix(obj.gender), state.individuals, 4);
    state.individuals.push(obj);
  }
  closeModal();
  await persistAndRender();
}

async function deleteIndividual(id){
  if(!confirm('이 개체를 삭제할까요? 관련된 페어링·클러치 기록은 남지만 연결이 끊길 수 있어요.')) return;
  state.individuals = state.individuals.filter(i=>i.id!==id);
  closeModal();
  await persistAndRender();
}

   메이팅(mating) 목록 · 아코디언 상세 · 메이팅 기록 · 메이팅 정보 폼
===================================================================== */

function buildIndividualSelectOptions(gender, selectedId){
  let html = `<option value="">선택 안 함</option>`;
  state.individuals.filter(i=>i.gender===gender).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko')).forEach(i=>{
    html += `<option value="${i.id}" ${i.id===selectedId?'selected':''}>${esc(i.name)} (${esc(i.id)})</option>`;
  });
  return html;
}

function toggleMatingExpand(id){
  if(expandedMatings.has(id)) expandedMatings.delete(id);
  else expandedMatings.add(id);
  updateMatingListBody();
}
function setMatingFilter(v){ listFilters.mating = v; updateMatingListBody(); }
let showEndedMatings = false;
function toggleShowEndedMatings(){ showEndedMatings = !showEndedMatings; updateMatingListBody(); updateMatingListControls(); }

let matingSort = 'recent';
function setMatingSort(v){ matingSort = v; updateMatingListBody(); }

const MATING_SORTERS = {
  recent: (a,b)=>(latestMatingDate(b)||'').localeCompare(latestMatingDate(a)||''),
  old: (a,b)=>(latestMatingDate(a)||'').localeCompare(latestMatingDate(b)||''),
  lay_soon: (a,b)=>{
    const da = matingDdayInfo(a), db = matingDdayInfo(b);
    const va = da.mode==='predicted' ? da.diff : Infinity;
    const vb = db.mode==='predicted' ? db.diff : Infinity;
    return va - vb;
  },
  lay_far: (a,b)=>{
    const da = matingDdayInfo(a), db = matingDdayInfo(b);
    const va = da.mode==='predicted' ? da.diff : -Infinity;
    const vb = db.mode==='predicted' ? db.diff : -Infinity;
    return vb - va;
  }
};

function getFilteredMatings(){
  const q = listFilters.mating.trim().toLowerCase();
  let items = state.matings.slice().sort(MATING_SORTERS[matingSort] || MATING_SORTERS.recent);
  if(!showEndedMatings){
    items = items.filter(m=>normalizeMatingStatus(m.status)!=='산란 종료');
  }
  if(q){
    items = items.filter(m=>(m.damName||'').toLowerCase().includes(q)||(m.sireName||'').toLowerCase().includes(q)||(m.id||'').toLowerCase().includes(q));
  }
  return items;
}
function updateMatingListBody(){
  const items = getFilteredMatings();
  const body = document.getElementById('mating-list-body');
  if(body) body.innerHTML = renderMatingListBody(items);
  const count = document.getElementById('mating-count');
  if(count) count.textContent = `${items.length} / ${state.matings.length}쌍`;
}
function updateMatingListControls(){
  const btn = document.getElementById('mating-ended-toggle');
  if(!btn) return;
  btn.className = 'chip-toggle' + (showEndedMatings ? ' chip-selected' : '');
  btn.textContent = showEndedMatings ? '종료 같이 보는 중 ✓' : '종료 같이 보기';
}
function renderMatingListBody(items){
  if(items.length===0){
    const endedCount = state.matings.filter(m=>normalizeMatingStatus(m.status)==='산란 종료').length;
    return `<div class="empty-state"><p>${!showEndedMatings && endedCount>0 ? '진행 중인 메이팅이 없어요. 종료된 메이팅 '+endedCount+'건이 숨겨져 있어요.' : '등록된 메이팅이 없어요.'}</p></div>`;
  }
  return items.map(m=>renderMatingCard(m)).join('');
}

function renderMatingList(){
  const items = getFilteredMatings();
  const endedCount = state.matings.filter(m=>normalizeMatingStatus(m.status)==='산란 종료').length;
  return `<div class="section-head"><h2>메이팅 관리</h2><span class="count" id="mating-count">${items.length} / ${state.matings.length}쌍</span></div>
    <div class="searchbar"><input placeholder="암컷·수컷 이름으로 검색" value="${esc(listFilters.mating)}" oninput="setMatingFilter(this.value)"></div>
    <div class="searchbar">
      <select onchange="setMatingSort(this.value)" style="flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 10px;font-size:13px;background:var(--surface);color:var(--ink-soft);">
        <option value="recent" ${matingSort==='recent'?'selected':''}>최근 메이팅일 최신순</option>
        <option value="old" ${matingSort==='old'?'selected':''}>최근 메이팅일 오래된순</option>
        <option value="lay_soon" ${matingSort==='lay_soon'?'selected':''}>산란 예정일 가까운순</option>
        <option value="lay_far" ${matingSort==='lay_far'?'selected':''}>산란 예정일 많이 남은순</option>
      </select>
    </div>
    ${endedCount>0?`<div class="searchbar"><button type="button" id="mating-ended-toggle" class="chip-toggle${showEndedMatings?' chip-selected':''}" onclick="toggleShowEndedMatings()">${showEndedMatings?'종료 같이 보는 중 ✓':'종료 같이 보기'}</button></div>`:''}
    <div id="mating-list-body">${renderMatingListBody(items)}</div>`;
}

  const body = `

      <div class="form-grid">
        <label class="field"><span>합사 시작일</span><input type="date" name="startDate" value="${entry?esc(entry.startDate||''):todayISO()}" required></label>
        <label class="field"><span>합사 종료일 (진행 중이면 비움)</span><input type="date" name="endDate" value="${entry?esc(entry.endDate||''):''}"></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">취소</button>
        <button type="submit" class="btn btn-primary">${entry?'수정':'추가'}</button>
      </div>
    </form>`;
  openModal(entry?'합사 기록 수정':'합사 기록 추가', body);

async function saveCohabitLogEntry(matingId, entryId){
  const m = state.matings.find(x=>x.id===matingId);
  if(!m) return;
  const fd = new FormData(document.getElementById('cohabit-log-form'));
  const startDate = fd.get('startDate');
  const endDate = fd.get('endDate') || null;
  if(!m.cohabitLog) m.cohabitLog = [];
  const isNewEntry = !entryId;
  if(entryId){
    const entry = m.cohabitLog.find(c=>c.id===entryId);
    if(entry){ entry.startDate = startDate; entry.endDate = endDate; }
  } else {
    m.cohabitLog.push({ id:'coh'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), startDate, endDate });
  }
  if(isNewEntry){
    bumpBreedingLevel(state.individuals.find(i=>i.id===m.damId), 1); // 암컷: 합사 시작 -> 보류
  }
  await persistAndRender();
  openMatingForm(matingId);
}
async function endCohabitToday(matingId, entryId){
  const m = state.matings.find(x=>x.id===matingId);
  if(!m || !m.cohabitLog) return;
  const entry = m.cohabitLog.find(c=>c.id===entryId);
  if(!entry) return;
  entry.endDate = todayISO();
  await persistAndRender();
  openMatingForm(matingId);
}
async function deleteCohabitLogEntry(matingId, entryId){
  if(!confirm('이 합사 기록을 삭제할까요?')) return;
  const m = state.matings.find(x=>x.id===matingId);
  if(!m || !m.cohabitLog) return;
  m.cohabitLog = m.cohabitLog.filter(c=>c.id!==entryId);
  await persistAndRender();
  openMatingForm(matingId);
}

function renderMatingCard(m){
  const dam = state.individuals.find(i=>i.id===m.damId);
  const sire = state.individuals.find(i=>i.id===m.sireId);
  let riskChip = '';
  if(dam && sire){
    const r = compareBloodline(dam, sire);
    if(r.level==='danger') riskChip = `<span class="chip danger">혈통 위험</span>`;
    else if(r.level==='warning') riskChip = `<span class="chip alt">혈통 주의</span>`;
  }
  const nextNum = nextClutchNum(m);
  const dday = matingDdayInfo(m);
  const cs = clutchesOfMating(m.id);
  const expanded = expandedMatings.has(m.id);
  const statusNorm = normalizeMatingStatus(m.status);
  const activeCohab = activeCohabitation(m);
  const activity = latestMatingActivity(m);
  const activityIsCohab = activity && activity.source==='cohabit';
  const activityLabel = activityIsCohab ? '최근 합사일' : '최근 메이팅일';
  const activityDate = activity ? activity.date : null;

  let ddayLabel, ddayValue;
  if(dday.mode==='ended'){ ddayLabel='산란 종료'; ddayValue='종료'; }
  else if(dday.mode==='waiting'){ ddayLabel=activityIsCohab?'합사 후 경과':'메이팅 후 경과'; ddayValue=`D+${dday.elapsed}`; }
  else if(dday.mode==='predicted'){ ddayLabel=`${nextNum}차 산란예정일`; ddayValue=`${fmtKo(dday.date)} (${formatDday(dday.diff)})`; }
  else { ddayLabel=`${nextNum}차 산란예정일`; ddayValue='-'; }

  let detail = '';
  if(expanded){
    let rows = '';
    if(cs.length===0){
      rows = `<div class="readonly-note" style="margin:6px 0 10px;">아직 기록된 알이 없어요.</div>`;
    } else {
      cs.forEach(c=>{
        const hasFertile = c.egg1Status==='유정' || c.egg2Status==='유정';
        const pred = hasFertile ? predictHatchDates(c.layDate, c.incubationTemp||m.incubationTemp||DEFAULT_INCUBATION_TEMP) : null;
        let rightText;
        if(c.actualHatchCount) rightText = '해칭 '+c.actualHatchCount;
        else if(!hasFertile) rightText = '무정';
        else if(pred && pred.avgDate) rightText = '예정 '+fmtKo(pred.avgDate);
        else rightText = '-';
        const abnormalNotes = [...eggWarningLabels(c,1), ...eggWarningLabels(c,2)];
        rows += `<div class="clutch-row" onclick="openClutchForm('${c.id}', '${m.id}')">
          <div class="cnum">${esc(c.clutchNum)}차</div>
          <div class="cmid">
            <span class="egg-mini">
              <span class="dot ${c.egg1Status==='유정'?'fertile':'infertile'} ${eggWarningLabels(c,1).length?'egg-warn':''}"></span>
              <span class="dot ${c.egg2Status==='유정'?'fertile':'infertile'} ${eggWarningLabels(c,2).length?'egg-warn':''}"></span>
            </span>
            &nbsp;${esc(c.layDate)||'-'}${abnormalNotes.length?` <span class="chip danger" style="padding:1px 7px;font-size:10px;">⚠️ ${esc(abnormalNotes.join('·'))}</span>`:''}
          </div>
          <div class="cright">${rightText}</div>
        </div>`;
      });
    }
    const logDates = (m.matingLog||[]).slice().sort();
    detail = `<div class="mating-detail">
      ${rows}
      <div class="mating-actions">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openClutchForm(null, '${m.id}')">+ 알 기록 추가</button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openMatingForm('${m.id}')">메이팅 정보 수정</button>
      </div>
      ${logDates.length?`<div class="mating-log">메이팅 기록: ${logDates.map(d=>esc(d)).join(' · ')}</div>`:''}
      ${(m.cohabitLog||[]).length?`<div class="mating-log">합사 이력: ${(m.cohabitLog||[]).slice().sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(c=>esc(c.startDate)+'~'+(c.endDate?esc(c.endDate):'진행중')).join(' · ')}</div>`:''}
    </div>`;
  }

  return `<div class="mating-card">
    <div class="mating-head" onclick="toggleMatingExpand('${m.id}')">
      <div class="card-top">
        <div><div class="card-title">${esc(m.damName)} × ${esc(m.sireName)}</div><div class="card-id">${esc(m.id)}</div></div>
        <button class="chip ${statusNorm==='진행 중'?'':'muted'}" style="border:none;cursor:pointer;font-family:inherit;" onclick="event.stopPropagation(); toggleMatingStatus('${m.id}')">${statusNorm}</button>
      </div>
      <div class="card-meta">${riskChip}${activeCohab?`<span class="chip alt">🏠 합사 중 (${esc(activeCohab.startDate)}~)</span>`:''}</div>
      <div class="card-datarow">
        <div class="dcell"><div class="lbl">${activityLabel}</div><div class="val">${activityDate?esc(activityDate):'-'}</div></div>
        <div class="dcell"><div class="lbl">${ddayLabel}</div><div class="val">${ddayValue}</div></div>
        <div class="dcell"><div class="lbl">누적 클러치</div><div class="val">${cs.filter(c=>c.egg1Status==='유정'||c.egg2Status==='유정').length}건</div></div>
      </div>
    </div>
    ${detail}
  </div>`;
}

async function saveMating(id){
  const form = document.getElementById('mating-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  obj.damId = document.getElementById('matingDamSelect').value;
  obj.sireId = document.getElementById('matingSireSelect').value;
  obj.cycleDays = parseInt(obj.cycleDays,10) || DEFAULT_CYCLE_DAYS;
  obj.incubationTemp = parseFloat(obj.incubationTemp) || DEFAULT_INCUBATION_TEMP;
  if(id){
    const item = state.matings.find(m=>m.id===id);
    const wasActive = normalizeMatingStatus(item.status)==='진행 중';
    const willBeActive = normalizeMatingStatus(obj.status)==='진행 중';
    Object.assign(item, obj);
    if(wasActive && !willBeActive){
      resetBreedingIfNoActiveMating(state.individuals.find(i=>i.id===item.sireId));
      resetBreedingIfNoActiveMating(state.individuals.find(i=>i.id===item.damId));
    } else if(!wasActive && willBeActive){
      bumpBreedingLevel(state.individuals.find(i=>i.id===item.sireId), 1);
      bumpBreedingLevel(state.individuals.find(i=>i.id===item.damId), 1);
    }
  } else {
    const matingDate = obj.firstMatingDate || '';
    const cohabitDate = obj.firstCohabitDate || '';
    delete obj.firstMatingDate;
    delete obj.firstCohabitDate;
    if(!matingDate && !cohabitDate){
      alert('메이팅 날짜나 합사 시작일 중 하나는 입력해주세요.');
      return;
    }
    obj.id = nextEntityId('HCC-P-', state.matings, 4);
    obj.matingLog = matingDate ? [matingDate] : [];
    if(cohabitDate){
      obj.cohabitLog = [{ id:'coh'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), startDate: cohabitDate, endDate: null }];
    }
    state.matings.push(obj);
    const sire = state.individuals.find(i=>i.id===obj.sireId);
    const dam = state.individuals.find(i=>i.id===obj.damId);
    if(matingDate){
      bumpBreedingLevel(sire, 1); // 수컷: 메이팅 -> 보류(유정란 나와야 예)
      bumpBreedingLevel(dam, 1);  // 암컷: 메이팅 -> 보류
    }
    if(cohabitDate){
      bumpBreedingLevel(dam, 1); // 암컷: 합사 시작 -> 보류
    }
  }
  closeModal();
  await persistAndRender();
}

function updateClutchHatchPreview(){

}

}

async function saveClutch(id, matingId){
  const form = document.getElementById('clutch-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  let damIdForBump = null, sireIdForBump = null;
  if(id){
    const item = state.clutches.find(c=>c.id===id);
    Object.assign(item, obj);
    damIdForBump = item.damId; sireIdForBump = item.sireId;
  } else {
    const mating = state.matings.find(m=>m.id===matingId);
    obj.matingId = matingId;
    obj.damId = mating?mating.damId:''; obj.damName = mating?mating.damName:'';
    obj.sireId = mating?mating.sireId:''; obj.sireName = mating?mating.sireName:'';
    const yy = currentYY();
    obj.id = nextEntityId('HCC-C'+yy+'-', state.clutches, 3);
    state.clutches.push(obj);
    damIdForBump = obj.damId; sireIdForBump = obj.sireId;
  }
  /* 유정란은 그 알을 낳은 암컷·수컷 둘 다 실제로 증명(프루븐)됐다는 뜻 - 수컷도 정자가 없는 경우가
     있어서, 메이팅만으로는 증명이 아니고 실제 유정란이 나와야 프루븐으로 올림 */
  if(obj.egg1Status==='유정' || obj.egg2Status==='유정'){
    markProven(state.individuals.find(i=>i.id===damIdForBump));
    markProven(state.individuals.find(i=>i.id===sireIdForBump));
  }
  closeModal();
  await persistAndRender();
}

async function deleteClutch(id){
  if(!confirm('이 알 기록을 삭제할까요?')) return;
  state.clutches = state.clutches.filter(c=>c.id!==id);
  closeModal();
  await persistAndRender();
}

/* ---------------- 산란·알 탭 (페어별 아코디언, 경과일 카운터) ---------------- */
let expandedEggGroups = new Set();
let showTempBreakdown = false;
function toggleTempBreakdown(){ showTempBreakdown = !showTempBreakdown; renderMainOnly(); }
function toggleEggGroup(matingId){
  if(expandedEggGroups.has(matingId)) expandedEggGroups.delete(matingId);
  else expandedEggGroups.add(matingId);
  renderMainOnly();
}
/* 그 페어의 아직 안 부화한 유정란들 중, 가장 빠른 부화 예정일을 찾는다(정렬용) */
function nextHatchPredictionForGroup(cs){
  let earliest = null;
  cs.forEach(c=>{
    [['egg1Status','A'],['egg2Status','B']].forEach(([field,label])=>{
      if(c[field]!=='유정') return;
      if(hatchlingForEgg(c.id,label)) return;
      const pred = predictHatchDates(c.layDate, c.incubationTemp||DEFAULT_INCUBATION_TEMP);
      if(pred && pred.avgDate && (!earliest || pred.avgDate<earliest)) earliest = pred.avgDate;
    });
  });
  return earliest;
}
function setEggGroupSort(v){ eggGroupSort = v; renderMainOnly(); }
let showEndedEggGroups = false;
function toggleShowEndedEggGroups(){ showEndedEggGroups = !showEndedEggGroups; renderMainOnly(); }

/* 이 페어의 알이 전부(무정 제외) 해칭 완료됐는지: 유정란인데 아직 연결된 해칭개체가 없는 게 하나라도 있으면 false */
/* 이 페어가 "더 이상 볼 게 없는" 상태인지: 메이팅이 아직 '진행 중'이면 앞으로 알이 더 나올 수 있으니
   무조건 계속 보여주고, '산란 종료'로 확정된 페어에 한해서만 유정란이 전부 부화됐는지로 판단한다. */
function isEggGroupFullyDone(clutches, mating){
  if(mating && normalizeMatingStatus(mating.status)!=='산란 종료') return false;
  for(const c of clutches){
    for(const [field,label] of [['egg1Status','A'],['egg2Status','B']]){
      const st = c[field];
      if(st==='없음') continue;
      if(st==='유정' && !hatchlingForEgg(c.id, label)) return false;
    }
  }
  return true;
}

function renderEggTab(){
  const breakdown = getTempHatchBreakdown();

  let html = `<div class="section-head"><h2>산란·알</h2></div>
  <div class="section-sub">페어를 누르면 그 페어가 낳은 알 전체가 보여요. 부화한 알은 초록, 부화 대기 중인 알은 경과일이 카운트되고, 무정란은 회색으로 표시돼요.</div>
  <div class="chipgroup-wrap">
    <button type="button" class="chipgroup-toggle" onclick="toggleTempBreakdown()">
      <span>우리집 온도별 실제 부화 평균${breakdown.length?(' · '+breakdown.length+'개 온도'):''}</span>
      <span class="chevron" id="tempBreakdownChevron">${showTempBreakdown?'▴':'▾'}</span>
    </button>
    <div class="chipgroup-panel" id="tempBreakdownPanel" style="display:${showTempBreakdown?'block':'none'};">
      ${breakdown.length===0
        ? `<div class="readonly-note">아직 실제 해칭 기록(인큐베이션 일수)이 없어요. 알 해칭 기록하면 여기 쌓여요.</div>`
        : breakdown.map(b=>`<div class="card-datarow" style="border-top:1px dashed var(--border);padding:9px 0;">
            <div class="dcell"><div class="lbl">${b.temp}°C</div><div class="val">평균 ${Math.round(b.avg)}일</div></div>
            <div class="dcell" style="text-align:right;"><div class="lbl">기록</div><div class="val">${b.count}마리</div></div>
          </div>`).join('')
      }
    </div>
  </div>`;

  const matingIds = [...new Set(state.clutches.filter(c=>c.egg1Status==='유정'||c.egg2Status==='유정').map(c=>c.matingId).filter(Boolean))];
  if(matingIds.length===0){
    html += `<div class="empty-state"><div class="dotrow"><span></span><span></span><span></span><span></span><span></span></div><p>등록된 알 기록이 없어요.</p></div>`;
    return html;
  }

  let groups = matingIds.map(mid=>{
    const mating = state.matings.find(m=>m.id===mid);
    const cs = clutchesOfMating(mid);
    return { matingId:mid, mating, clutches:cs, activity: mating?latestMatingActivity(mating):null, done:isEggGroupFullyDone(cs, mating) };
  }).filter(g=>g.clutches.length>0);

  const endedCount = groups.filter(g=>g.done).length;
  if(!showEndedEggGroups){
    groups = groups.filter(g=>!g.done);
  }

  groups.sort((a,b)=>{
    if(eggGroupSort==='recent' || eggGroupSort==='old'){
      const av=(a.activity?a.activity.date:'')||'', bv=(b.activity?b.activity.date:'')||'';
      return eggGroupSort==='recent' ? bv.localeCompare(av) : av.localeCompare(bv);
    }
    // 부화 예정일 가까운순/많이 남은순: 예정일 없는 페어는 항상 맨 뒤로
    const ad = nextHatchPredictionForGroup(a.clutches), bd = nextHatchPredictionForGroup(b.clutches);
    if(!ad && !bd) return 0;
    if(!ad) return 1;
    if(!bd) return -1;
    return eggGroupSort==='hatch_soon' ? ad.localeCompare(bd) : bd.localeCompare(ad);
  });

  html += `<div class="section-head" style="margin-top:18px;">
    <h2 style="font-size:15px;">페어 목록</h2>
    <select onchange="setEggGroupSort(this.value)" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:12.5px;background:var(--surface);color:var(--ink-soft);">
      <option value="recent" ${eggGroupSort==='recent'?'selected':''}>메이팅 최신순</option>
      <option value="old" ${eggGroupSort==='old'?'selected':''}>메이팅 오래된순</option>
      <option value="hatch_soon" ${eggGroupSort==='hatch_soon'?'selected':''}>부화 예정일 가까운순</option>
      <option value="hatch_far" ${eggGroupSort==='hatch_far'?'selected':''}>부화 예정일 많이 남은순</option>
    </select>
  </div>`;
  if(endedCount>0){
    html += `<div class="searchbar" style="margin-top:-6px;"><button type="button" class="chip-toggle${showEndedEggGroups?' chip-selected':''}" onclick="toggleShowEndedEggGroups()">${showEndedEggGroups?'종료 같이 보는 중 ✓':'종료 같이 보기 ('+endedCount+'쌍 숨김)'}</button></div>`;
  }

  if(groups.length===0){
    html += `<div class="empty-state" style="margin-top:12px;"><p>${endedCount>0?'전부 부화 완료돼서 숨겨져 있어요. 위 버튼으로 같이 볼 수 있어요.':'표시할 페어가 없어요.'}</p></div>`;
  } else {
    groups.forEach(g=>{
      html += renderEggGroupCard(g);
    });
  }

  return html;
}

function renderEggGroupCard(g){
  const { matingId, mating, clutches:cs, activity } = g;
  const expanded = expandedEggGroups.has(matingId);
  const damName = cs[0].damName, sireName = cs[0].sireName;
  const openCount = cs.reduce((sum,c)=>{
    let n = 0;
    if(c.egg1Status==='유정' && !hatchlingForEgg(c.id,'A')) n++;
    if(c.egg2Status==='유정' && !hatchlingForEgg(c.id,'B')) n++;
    return sum + n;
  }, 0);
  const fertileClutchCount = cs.filter(c=>c.egg1Status==='유정'||c.egg2Status==='유정').length;
  const activityLabel = activity && activity.source==='cohabit' ? '최근 합사일' : '최근 메이팅일';
  const activityDate = activity ? activity.date : null;

  let detail = '';
  if(expanded){
    const sorted = cs.slice().sort((a,b)=>(a.layDate||'').localeCompare(b.layDate||''));
    let eggsHtml = '';
    sorted.forEach(c=>{
      [['egg1Status','A',1],['egg2Status','B',2]].forEach(([field,label,num])=>{
        const st = c[field];
        if(st==='없음') return;
        const fertile = st==='유정';
        const hatchling = fertile ? hatchlingForEgg(c.id, label) : null;
        const days = c.layDate ? daysBetween(c.layDate, todayISO()) : null;
        const pred = predictHatchDays(c.incubationTemp||DEFAULT_INCUBATION_TEMP);
        const overdue = !hatchling && fertile && pred.max!==null && days!==null && days>pred.max;
        const warnings = eggWarningLabels(c, num);
        let cls, num2, lbl2;
        if(!fertile){ cls='infertile'; num2='×'; lbl2='무정'; }
        else if(hatchling){ cls='hatched'; num2=hatchling.incubationDays||'✓'; lbl2='완료'; }
        else if(overdue){ cls='overdue'; num2=days; lbl2='D+'; }
        else { cls='fertile'; num2=days!==null?days:'-'; lbl2='D+'; }
        eggsHtml += `<div class="egg ${cls} ${warnings.length?'egg-condition-warn':''}" onclick="openEggDetail('${c.id}', ${num})">
          <span class="cnum-badge">${esc(c.clutchNum)}차</span>
          ${warnings.length?`<span class="egg-warn-badge" title="${esc(warnings.join(', '))}">⚠️ ${esc(warnings.join('·'))}</span>`:''}
          <div class="num">${num2}</div>
          <div class="lbl">${lbl2}</div>
        </div>`;
      });
    });
    detail = `<div class="mating-detail"><div class="egg-row">${eggsHtml}</div></div>`;
  }

  return `<div class="mating-card">
    <div class="mating-head" onclick="toggleEggGroup('${matingId}')">
      <div class="card-top">
        <div><div class="card-title">${esc(damName)} × ${esc(sireName)}</div><div class="card-id">${activityLabel} ${activityDate?esc(activityDate):'-'}</div></div>
        <div class="chip ${openCount>0?'alt':''}">${openCount>0?(openCount+'건 대기'):'모두 해칭'}</div>
      </div>
      <div class="card-meta"><span class="chip muted">누적 ${fertileClutchCount}클러치</span></div>
    </div>
    ${detail}
  </div>`;
}


function openEggDetail(clutchId, eggNum){
  const c = state.clutches.find(x=>x.id===clutchId);
  if(!c) return;
  const status = eggNum===1 ? c.egg1Status : c.egg2Status;
  const condition = (eggNum===1 ? c.egg1Condition : c.egg2Condition) || '정상(도자기)';
  const incubationIssue = (eggNum===1 ? c.egg1IncubationIssue : c.egg2IncubationIssue) || '없음';
  const warnings = eggWarningLabels(c, eggNum);
  const label = eggNum===1 ? 'A' : 'B';
  const fertile = status==='유정';
  const hatchling = fertile ? hatchlingForEgg(clutchId, label) : null;
  const days = c.layDate ? daysBetween(c.layDate, todayISO()) : null;
  const temp = c.incubationTemp || DEFAULT_INCUBATION_TEMP;
  const pred = predictHatchDates(c.layDate, temp);

  let resultBlock;
  if(hatchling){
    resultBlock = `
      <div class="form-divider">해칭 완료</div>
      <div class="card-datarow" style="border-top:none;">
        <div class="dcell"><div class="lbl">실제 해칭일</div><div class="val">${esc(hatchling.hatchDate)||'-'}</div></div>
        <div class="dcell"><div class="lbl">실제 인큐베이션</div><div class="val">${hatchling.incubationDays?hatchling.incubationDays+'일':'-'}</div></div>
        <div class="dcell"><div class="lbl">모프</div><div class="val">${esc(hatchling.morph)||'-'}</div></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" onclick="openHatchlingForm('${hatchling.id}');">해칭개체 정보 보기/수정 →</button>
      </div>`;
  } else if(!fertile){
    resultBlock = `
      <div class="readonly-note" style="margin-top:12px;">${status==='무정'?'무정란이라 부화하지 않아요.':'유/무정 상태가 아직 미상이에요. 확인되면 클러치 정보에서 상태를 바꿔주세요.'}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" onclick="openClutchForm('${c.id}');">클러치 정보 수정 →</button>
      </div>`;
  } else {
    resultBlock = `
      ${pred.danger?`<div class="bloodline-banner danger" style="margin-top:14px;">⚠️ 설정 온도가 안전 범위(${MIN_SAFE_TEMP}~${MAX_SAFE_TEMP}°C)를 벗어났어요.</div>`:''}
      <div class="form-divider">부화 예정일</div>
      <div class="card-datarow" style="border-top:none;">
        <div class="dcell"><div class="lbl">최단</div><div class="val">${pred.minDate?fmtKo(pred.minDate):'-'}</div></div>
        <div class="dcell"><div class="lbl">평균</div><div class="val">${pred.avgDate?fmtKo(pred.avgDate):'-'}</div></div>
        <div class="dcell"><div class="lbl">최장</div><div class="val">${pred.maxDate?fmtKo(pred.maxDate):'-'}</div></div>
      </div>
      <div class="modal-actions" style="flex-direction:column;">
        <button class="btn btn-primary btn-block" onclick="openHatchlingForm(null, {clutchId:'${c.id}', eggLabel:'${label}'});">🐣 이 알 해칭 기록하기 →</button>
        <button class="btn btn-ghost btn-block" onclick="openClutchForm('${c.id}');">클러치 정보 수정 →</button>
      </div>`;
  }

  const body = `
    <div class="readonly-note" style="font-size:13px;">${esc(c.damName)} × ${esc(c.sireName)} · ${esc(c.clutchNum)}차 클러치 · 알 ${eggNum}</div>
    ${warnings.length?`<div class="bloodline-banner danger" style="margin-top:8px;">⚠️ 이 알은 <b>${esc(warnings.join(', '))}</b> 상태로 표시돼 있어요. 다른 알보다 주의 깊게 지켜봐 주세요.</div>`:''}
    <div class="card-datarow" style="border-top:none;padding-top:4px;">
      <div class="dcell"><div class="lbl">유/무정</div><div class="val">${esc(status)}</div></div>
      <div class="dcell"><div class="lbl">산란 시 상태</div><div class="val">${esc(condition)}</div></div>
      <div class="dcell"><div class="lbl">경과일</div><div class="val">D+${days!==null?days:'-'}</div></div>
    </div>
    <div class="card-datarow">
      <div class="dcell"><div class="lbl">인큐베이션 중 이상</div><div class="val">${esc(incubationIssue)}</div></div>
      <div class="dcell"><div class="lbl">온도</div><div class="val">${temp}°C</div></div>
    </div>
    ${resultBlock}
  `;
  openModal(`알 상세 · ${c.id}`, body);
}

/* ---------------- 개체/해칭개체 검색 선택창(모달) ---------------- */
let entityPickerState = { side:null, query:'', typeFilter:'' };

function openEntityPicker(side){
  entityPickerState = { side, query:'', typeFilter:'' };
  renderEntityPickerModal();
}
function getEntityPickerList(){
  const q = entityPickerState.query.trim().toLowerCase();
  let items = [];
  if(entityPickerState.typeFilter !== 'hatchling'){
    state.individuals.forEach(i=>{
      const morphLabel = formatMorphDisplayFull(i.morph, i.morphHet, i.morphPatterns, i.morphColors);
      items.push({ key:'IND:'+i.id, kind:'individual', ent:i, label:i.name||i.id, sub:`${i.gender}${morphLabel?' · '+morphLabel:''}` });
    });
  }
  if(entityPickerState.typeFilter !== 'individual'){
    state.hatchlings.forEach(h=>{
      const morphLabel = formatMorphDisplayFull(h.morph, h.morphHet, h.morphPatterns, h.morphColors) || '모프 미정';
      items.push({ key:'HAT:'+h.id, kind:'hatchling', ent:h, label:morphLabel, sub:h.id });
    });
  }
  if(q){
    items = items.filter(it=>(it.label||'').toLowerCase().includes(q) || (it.sub||'').toLowerCase().includes(q) || (it.ent.id||'').toLowerCase().includes(q));
  }
  items.sort((a,b)=>(a.label||'').localeCompare(b.label||'','ko'));
  return items;
}
function renderEntityPickerListHtml(items){
  if(items.length===0) return `<div class="empty-state"><p>검색 결과가 없어요.</p></div>`;
  return `<div class="compact-list" style="grid-template-columns:1fr;">` + items.map(it=>`
    <div class="compact-row" onclick="pickEntity('${it.key}')">
      ${avatarHtml(it.ent, it.kind, 34)}
      <div class="compact-info">
        <div class="compact-name">${esc(it.label)}</div>
        <div class="compact-meta">${esc(it.sub)}</div>
      </div>

function renderPedigreeTree(ent, label){

/* 재귀적으로 부/모를 따라가며 카드형 가계도를 그린다 (최대 3대: 부모/조부모/증조부모) */
function renderPedigreeVisualNode(ent, sideLabel, gen, maxGen){
  if(!ent) return '';
  const morphLabel = formatMorphDisplayFull(ent.morph, ent.morphHet, ent.morphPatterns, ent.morphColors);
  const box = `<div class="ped-box">
    ${avatarHtml(ent)}
    <div class="ped-info">
      <div class="ped-name">${sideLabel?`<span class="ped-side">${esc(sideLabel)}</span> `:''}${esc(ent.name||ent.morph||ent.id)}</div>
      <div class="ped-morph">${esc(morphLabel)||'모프 미상'}${ent.gender?' · '+esc(ent.gender):''}</div>
      <div class="ped-code">${esc(ent.id)}</div>
    </div>
  </div>`;
  if(gen>=maxGen) return box;

  let childrenHtml = '';
  ['sire','dam'].forEach(side=>{
    const ref = parentRef(ent, side);
    const sideKo = side==='sire' ? '부' : '모';
    if(!ref){
      return;
    }
    if(ref.type==='linked'){
      const linkedInd = state.individuals.find(i=>i.id===ref.id);
      if(linkedInd){
        childrenHtml += renderPedigreeVisualNode(linkedInd, sideKo, gen+1, maxGen);
        return;
      }
    }
    const nm = ent[side+'Name'];
    if(nm){
      childrenHtml += `<div class="ped-box ped-box-named">
        <div class="ped-avatar-placeholder">❔</div>
        <div class="ped-info">
          <div class="ped-name"><span class="ped-side">${esc(sideKo)}</span> ${esc(nm)}</div>
          <div class="ped-morph">${ent[side+'Company']?esc(ent[side+'Company']):''} <span class="ped-tag">미등록</span></div>
        </div>
      </div>`;
    }
  });
  if(!childrenHtml) return box;
  return box + `<div class="ped-children">${childrenHtml}</div>`;
}

/* 개체 폼 등에서 단독으로 여는 가계도 모달 */
function openPedigreeTreeModal(compositeId){
  const ent = getEntityById(compositeId);
